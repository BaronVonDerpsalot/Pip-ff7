/* ----- Claude drafts a brainstorm spec for a record that has none (ground rule 0a) ----- */
const STYLE_WORDS=/\b(pixel[- ]?art|pixelated|8[- ]?bit|16[- ]?bit|sprite|watercolou?r|painterly|painted|oil paint|illustrat\w*|render(ed|ing)?|cel[- ]?shad\w*|anime|cartoon\w*|photo\w*|realistic|stylis\w*|styliz\w*|art style|in the style of|palette|muted colou?rs?|cinematic|lens|bokeh|depth of field|3d model|low[- ]poly|concept art|studio ghibli|ghibli)\b/i;
function stripStyle(t){ t=String(t||"").trim(); if(!t) return {text:"",cut:0}; const parts=t.split(/(?<=[.!?])\s+/); const keep=parts.filter(p=>!STYLE_WORDS.test(p)); return {text:keep.join(" ").trim(),cut:parts.length-keep.length}; }
function specGuessPrefix(rid){
  const chain=[rid,...placeChain(rid).reverse()]; const count={};
  for(const pid of chain){ for(const [sid,s] of Object.entries(S.specs)) if(s.place===pid){ const a=SPEC_AREAS.find(([p])=>sid.startsWith(p)); if(a) count[a[0]]=(count[a[0]]||0)+1; } if(Object.keys(count).length) break; }
  const best=Object.entries(count).sort((a,b)=>b[1]-a[1])[0]; return best?best[0]:"";
}
/* open questions about a record: open loose ends that link it, that it mentions, or that mention it */
function specOpenQs(rid){
  const e=S.entries[rid]; if(!e) return [];
  const re=new RegExp("\\[\\["+rid+"(?=[\\]|])");
  return Object.entries(S.loose).filter(([lid,l])=>l.open!==false&&((l.links||[]).includes(rid)||new RegExp("\\[\\["+lid+"(?=[\\]|])").test(String(e.body||""))||re.test(String(l.body||""))));
}
function specGenPrompt(rid){
  const e=S.entries[rid], kind=e.kind==="place"?"screen":e.kind;
  const P=[`You are drafting one visual spec for Mike's Story Room: the factual brief for one image in his game (a top-down Zelda-style adventure). A separate planning room owns all style, medium and art direction, so you write none of it.`];
  P.push(`THE RECORD (${KIND[e.kind]?.label||e.kind}, ${e.status||"brainstorm"}):\n`+recordDump(rid));
  if(e.kind==="place"){
    const ch=placeChain(rid); if(ch.length) P.push("IT SITS INSIDE: "+ch.map(x=>S.entries[x]?.name||x).join(" › "));
    const bs=beatsAt(rid).slice(0,6); if(bs.length) P.push("BEATS THAT HAPPEN HERE:\n"+bs.map(([bid,b])=>`- ${b.title} (${bid}): ${plSnip(b.body||"",400)}`).join("\n"));
    const kids=placeKids(rid); if(kids.length) P.push("PLACES INSIDE IT: "+kids.map(([,k])=>k.name).join(", "));
    const near=specUses(rid).slice(0,2); if(near.length) P.push("ANOTHER SPEC FOR A NEARBY SCREEN, for the level of detail only:\n"+near.map(([sid,s])=>`${sid}: ${s.contents||""}`).join("\n"));
  } else {
    const ex=Object.entries(S.specs).find(([,s])=>s.kind===kind&&s.show); if(ex) P.push(`ANOTHER ${kind.toUpperCase()} SPEC, for the level of detail only:\n${ex[0]}: ${ex[1].show}`);
  }
  const rules=[`- Only what the record and its beats establish, stated plainly as physical fact. Where the record is silent, keep it simple and generic rather than inventing story: no new characters, events or lore.`,
    `- NO style, medium or art direction words at all: nothing about pixel art, painting, illustration, colour palette, lighting style, camera, lens or rendering. Describe what is physically there, not how it looks as a picture.`];
  let fields;
  if(kind==="screen"){
    rules.push(`- A screen is one playable screen or still of this place. "hidden" always says no Pip and no other characters (NPCs are placed in-engine), unless something huge and fixed is part of the set.`,
      `- shot is one of: playable (default), establishing, layout, reveal, insert. time is one of: ${SPEC_TIMES.join(", ")}, or empty.`,
      `- text is the exact wording of any sign the beat needs, otherwise empty.`);
    fields=`{"contents":"what is physically there, 2 to 5 sentences","visible":"what the beats need on screen, or empty","hidden":"what must not be there","mood":"a few words","time":"","shot":"playable","text":"","tag":"canon|mixed|invented","note":"one line on what you assumed"}`;
  } else {
    rules.push(`- This is an isolated, full-body, whole and unobstructed image: the source for a 3D model. "show" lists the identifying features the record gives, as plain facts (shape, size, colours, markings, what they carry). No poses or views: those are the planning room's call.`);
    fields=`{"show":"identifying features from the record","mood":"","tag":"canon|mixed|invented","note":"one line on what you assumed"}`;
  }
  const oq=specOpenQs(rid);
  if(oq.length) rules.push(`- These questions about it are OPEN and Mike settles them, not you. Don't answer any of them in the spec: where one bears on what the image shows, describe that part plainly and generically and say so in the note.\n`+oq.map(([lid,l])=>`  - ${l.title} (${lid})${l.body?": "+plSnip(l.body,200):""}`).join("\n"));
  P.push("RULES\n"+rules.join("\n")+`\n- tag: canon if everything comes straight from the record, mixed if you filled small gaps, invented if most of it is yours.`);
  P.push(`OUTPUT: only one JSON object, no other text:\n${fields}`);
  return P.join("\n\n");
}
function specGenId(rid){
  const e=S.entries[rid]; const stem=slug((e.name||rid).replace(/^the /i,"")).split("_").filter(Boolean).slice(0,3).join("_")||rid;
  let base;
  if(e.kind==="character") base="c_"+stem; else if(e.kind==="item") base="p_"+stem;
  else { const pre=specGuessPrefix(rid)||"x_"; base=pre+stem+"_01"; }
  let id=base, n=2; while(S.specs[id]||(S.specGen&&S.specGen.made&&S.specGen.made.some(o=>o.id===id))) id=base.replace(/_\d\d$/,"")+(e.kind==="place"?"_"+String(n++).padStart(2,"0"):"_"+n++);
  return id;
}
async function specGenOne(rid,signal){
  const e=S.entries[rid]; if(!e) throw new Error("gone");
  const res=await S.sample([{role:"user",content:specGenPrompt(rid)}],{...plModel(),signal});
  const m=String(res.text||"").match(/\{[\s\S]*\}/); if(!m) throw new Error("no spec came back");
  let j; try{ j=JSON.parse(m[0]); }catch(x){ throw new Error("couldn’t read the spec"); }
  const kind=e.kind==="place"?"screen":e.kind, t=now(); let cut=0;
  const clean=k=>{ const r=stripStyle(j[k]); cut+=r.cut; return r.text; };
  const gid=e.game&&e.game!=="series"?e.game:(specGameScope()!=="all"?specGameScope():nextGame()||"series");
  const d={kind,game:gid,status:"brainstorm",source:"claude",tag:SPEC_TAGS.some(x=>x[0]===j.tag)?j.tag:"mixed",created:t,updated:t,written:t,edited_by:"claude",order:specNextOrder()};
  if(kind==="screen"){
    d.place=rid; d.beats=[]; d.padding=true; d.exits=[];
    for(const k of ["contents","visible","hidden","mood","text"]){ const v=clean(k); if(v) d[k]=v; }
    if(!d.hidden) d.hidden="Pip. Any other characters: NPCs are placed in-engine.";
    if(SPEC_TIMES.includes(j.time)) d.time=j.time;
    d.shot=SHOTS.some(x=>x[0]===j.shot)?j.shot:"playable";
    const bs=beatsAt(rid).map(([bid])=>bid); if(bs.length){ d.beats=bs.slice(0,3); delete d.padding; }
  } else { d.record=rid; for(const k of ["show","mood"]){ const v=clean(k); if(v) d[k]=v; } }
  const note=String(j.note||"").trim(); d.note=["Drafted by Claude from the record."+(cut?` ${cut} sentence${cut>1?"s":""} with style words cut.`:""),note].filter(Boolean).join(" ");
  if(!(d.contents||d.show)) throw new Error("the spec came back empty");
  d.sources=specSources(d);
  return {id:specGenId(rid),data:d};
}
async function specGenRun(rids){
  if(!S.sample){ toast(S.sampleChecked?"Asking Claude isn’t allowed in this view.":"Claude isn’t ready yet. Try again in a second."); return; }
  if(S.specGen&&S.specGen.busy) return;
  const G=S.specGen={busy:true,total:rids.length,done:0,failed:[],made:[],ctrl:new AbortController(),current:""};
  render();
  for(const rid of rids){
    if(G.ctrl.signal.aborted) break;
    G.current=rid; specGenBar();
    try{ const r=await specGenOne(rid,G.ctrl.signal); G.made.push(r); }
    catch(e){ if(e?.code==="cancelled"||G.ctrl.signal.aborted) break; G.failed.push({rid,why:e?.code==="rate_limited"?"Claude’s busy":e?.message||e?.code||"error"}); if(e?.code==="rate_limited") break; }
    G.done++; specGenBar();
  }
  G.current="";
  if(G.made.length){
    const ops=G.made.map(o=>({type:"specs",id:o.id,before:null,after:o.data}));
    const lbl=G.made.length===1?"Drafted spec: "+G.made[0].id:`Drafted ${G.made.length} specs for records without one`;
    try{ await commit(ops,lbl); }catch(e){ G.failed.push({rid:"",why:"save failed"}); }
  }
  G.busy=false;
  toast(G.made.length?`${G.made.length} spec${G.made.length>1?"s":""} drafted as brainstorm. Undo from the Inbox’s change list.`:G.failed.length?"No specs drafted.":"Stopped.");
  render();
}
function specGenBarHtml(){
  const G=S.specGen; if(!G) return "";
  if(G.busy) return `<div class="banner sgen"><span>Claude is drafting specs: ${G.done} of ${G.total}${G.current?` · ${esc(S.entries[G.current]?.name||G.current)}`:""}</span><button class="btn ghost" data-act="spec-gen-stop">Stop</button></div>`;
  if(!G.made.length&&!G.failed.length) return "";
  return `<div class="banner sgen"><span>${G.made.length?`Drafted ${G.made.length} as brainstorm: ${G.made.map(o=>`<a href="#spec-${toHash(o.id)}"><code class="sid">${esc(o.id)}</code></a>`).join(", ")}.`:""}${G.failed.length?` ${G.failed.length} didn’t work${G.failed[0].why?" ("+esc(G.failed[0].why)+")":""}.`:""}</span><button class="btn ghost" data-act="spec-gen-ok">OK</button></div>`;
}
function specGenBar(){ const b=$("#spec-gen"); if(b) b.innerHTML=specGenBarHtml(); }

const SPEC_CONTENT=["kind","place","record","scene","beats","contents","visible","hidden","route","stand","happens","start","end","in_shot","show","state_of","state","change","exits","mood","time","shot","text"];
async function specSave(){
  specSyncDraft(); const D=S.specDraft; const s=D.data;
  const id=D.isNew?slug(D.id):D.id;
  if(!id){ toast("It needs an id."); return; }
  if(D.isNew&&S.specs[id]){ toast(`There’s already a spec called ${id}.`); return; }
  if(s.state_of===id){ toast("A spec can’t be a state of itself."); return; }
  if(!s.game){ toast("Pick a game."); return; }
  const prev=D.isNew?null:S.specs[id];
  if(s.kind!=="screen"){ for(const k of ["place","contents","visible","hidden","exits","padding","route","stand"]) delete s[k]; }
  if(s.kind==="screen"){ for(const k of ["record","show","scene","happens","start","end","in_shot"]) delete s[k]; if(!(s.beats||[]).length) s.padding=true; else delete s.padding; }
  if(s.kind==="character"||s.kind==="item"){ delete s.beats; delete s.place; }
  const changed=!prev||SPEC_CONTENT.some(k=>JSON.stringify(prev[k]??null)!==JSON.stringify(s[k]??null));
  const t=now(); const data={...s, updated:t, edited_by:"mike"};
  if(D.isNew){ data.created=t; data.source=data.source||"mike"; data.order=data.order??(s.state_of&&S.specs[s.state_of]?(S.specs[s.state_of].order||0)+1:specNextOrder()); }
  if(changed) data.written=t;
  data.sources=specSources(data);
  if(await put("specs",id,data)){ toast(D.isNew?"Spec added.":changed?"Saved.":"Saved. Nothing in it changed, so it’s still dated "+ago(data.written||data.created)+"."); S.specDraft=null; history.replaceState(null,"","#spec-"+toHash(id)); route(); }
}
async function specAct(act,el,id){
  switch(act){
    case "spec-gen": { const rid=el.dataset.rec; if(!rid) return true;
      if(specOpenQs(rid).length&&S.armed!=="sgen:"+rid){ S.armed="sgen:"+rid; render(); return true; }
      S.armed=null; specGenRun([rid]); return true; }
    case "spec-gen-all": { if(S.armed!=="sgenall"){ S.armed="sgenall"; render(); return true; } S.armed=null; specGenRun(specMissing(specGameScope()).map(([id])=>id).filter(id=>!specOpenQs(id).length)); return true; }
    case "spec-gen-stop": { if(S.specGen) S.specGen.ctrl.abort(); return true; }
    case "spec-gen-ok": { S.specGen=null; render(); return true; }
    case "spec-show": { const F=specFilt(); F.show=el.dataset.v; store("specf",JSON.stringify(F)); render(); return true; }
    case "spec-kind": { const F=specFilt(); F.kind=el.dataset.v; store("specf",JSON.stringify(F)); render(); return true; }
    case "spec-new": { const rid=el.dataset.rec||""; const d=specDraftFor(rid); let base="";
      if(d.kind==="character") base="c_"; else if(d.kind==="item") base="p_";
      if(rid&&base){ const f=find(rid); base+=slug((f?.rec.name||rid).replace(/^the /i,"")).split("_").slice(0,3).join("_"); }
      specEdit(base,d,true); return true; }
    case "spec-edit": { const s=S.specs[id]; if(!s) return true; specEdit(id,s,false); return true; }
    case "spec-state": { const s=S.specs[id]; if(!s) return true;
      const d=JSON.parse(JSON.stringify(s)); for(const k of ["created","updated","written","edited_by","status","source","order","state","change","sources","note"]) delete d[k];
      d.status="brainstorm"; d.state_of=id; d.source="mike";
      const stem=id.replace(/_\d\d[a-z]?$/,""); specEdit(stem+"_state_01",d,true); return true; }
    case "spec-dkind": specSyncDraft(); if(S.specDraft) S.specDraft.data.kind=el.dataset.v; render(); return true;
    case "spec-save": el.disabled=true; await specSave(); el.disabled=false; return true;
    case "spec-cancel": { const D=S.specDraft; S.specDraft=null; if(D&&!D.isNew) go("spec-"+toHash(D.id)); else history.back(); return true; }
    case "spec-fresh": { const s=S.specs[id]; if(!s) return true; if(S.armed!=="sfresh:"+id){ S.armed="sfresh:"+id; render(); return true; }
      S.armed=null; const t=now(); if(await put("specs",id,{...s,written:t,updated:t,refreshed:t})) toast("Marked as refreshed."); return true; }
    case "spec-canon": { const s=S.specs[id]; if(!s) return true; if(S.armed!=="scanon:"+id){ S.armed="scanon:"+id; render(); return true; }
      S.armed=null; if(await put("specs",id,{...s,status:"canon",canon_at:now(),canon_by:"mike",updated:now()})) toast("Canon."); return true; }
    case "spec-del": { if(!S.specs[id]) return true; if(S.armed!=="sdel:"+id){ S.armed="sdel:"+id; render(); return true; }
      S.armed=null; const parent=S.specs[id].state_of;
      if(await remove("specs",id)){ toast("Deleted."); go(parent&&S.specs[parent]?"spec-"+toHash(parent):"specs"); }
      return true; }
  }
  return false;
}

/* ---------- story map: series > game > beat > scene, with the gaps showing ---------- */
const MAP_ROLES=[["opening","Opening"],["","Middle"],["climax","Climax"],["ending","Ending"],["stinger","After the ending"]];
function mapOpen(){
  if(!S.mapOpen){ let a=null; try{ a=JSON.parse(recall("mapopen")||"null"); }catch(e){}
    S.mapOpen=new Set(Array.isArray(a)?a:[nextGame()].filter(Boolean)); }
  return S.mapOpen;
}
function parkBtn(gid,it){ return `<button class="btn" data-act="rd-park" data-id="${gid}" data-k="${it.key}">${it.parked?"Un-park":"Finding it as I go"}</button>`; }
function mapParked(gid,it,label){ return `<div class="slot parked"><span class="what">⏸ ${label}: finding it as you go</span>${parkBtn(gid,it)}</div>`; }
function mapSolid(b){ return b.status==="canon"||b.status==="maybe"; }
function mapGaps(gid){
  if(gid==="series"||!S.games[gid]||isReleased(gid)) return [];
  const gaps=readiness(gid).items.filter(i=>!i.done&&!i.parked).map(i=>({kind:i.kind,key:i.key,label:i.label,role:i.kind==="role"?i.key.slice(5):""}));
  for(const [bid,b] of beatsOf(gid)) if(mapSolid(b)&&!scenesOfBeat(bid).length) gaps.push({kind:"scene",key:bid,label:`no scene yet for “${b.title}”`});
  return gaps;
}
function mapRoleBeat(gid,role){ const x=beatsOf(gid).find(([,b])=>b.role===role); return x?x[0]:""; }
function mapGapText(g,gid){
  if(g.kind==="spine") return `the spine’s “${g.label}” is blank.`;
  if(g.kind==="role") return mapRoleBeat(gid,g.role)?`the ${g.role} beat is still a brainstorm.`:`no ${g.role} beat yet.`;
  if(g.kind==="middle") return `the middle needs ${MIDDLE_MIN} beats at maybe or canon.`;
  if(g.kind==="loose") return "loose ends it needs are still open.";
  return g.label+".";
}
function mapGapBtn(g,gid){
  if(g.kind==="spine") return `<button class="btn" data-act="map-spine" data-id="${gid}">Fill it in</button>`;
  if(g.kind==="role"){ const bid=mapRoleBeat(gid,g.role); return bid?`<button class="btn" data-act="open" data-id="${bid}">Open it</button>`:`<button class="btn" data-act="map-newbeat" data-id="${gid}" data-role="${g.role}">Add beat</button>`; }
  if(g.kind==="middle") return `<button class="btn" data-act="rd-brain" data-id="${gid}">Brainstorm</button>`;
  if(g.kind==="loose") return `<button class="btn" data-act="go" data-to="loose">Open them</button>`;
  return `<button class="btn" data-act="newscene" data-beat="${g.key}">Add scene</button>`;
}
function mapSceneRow(sid,s){
  const nl=(s.lines||[]).filter(l=>l.text).length;
  return `<a class="mapscene" href="#r-${toHash(sid)}"><span aria-hidden="true">❝</span><span class="t">${esc(s.title)}</span>${statusMark(s.status)}<span class="tag">${nl?nl+" line"+(nl===1?"":"s"):"no lines yet"}</span></a>`;
}
function mapBeatHtml(bid,b,slots,n){
  const sc=scenesOfBeat(bid), w=beatWarnings(bid,b).length;
  return `<a class="mapbeat ${b.status==="canon"?"canon":""}" href="#r-${toHash(bid)}"><span class="title">${n?n+". ":""}${esc(b.title)}</span><span class="meta">${statusMark(b.status)}${b.place&&S.entries[b.place]?`<span class="tag">▲ ${esc(S.entries[b.place].name)}</span>`:""}${w?`<span class="warn">⚠ ${w} to check</span>`:""}</span></a>`
    + sc.map(([sid,s])=>mapSceneRow(sid,s)).join("")
    + (slots&&!sc.length&&mapSolid(b)?`<div class="slot sub"><span class="what">No scene yet</span><button class="btn" data-act="newscene" data-beat="${bid}">Add scene</button></div>`:"");
}
function mapGameBody(gid){
  const beats=beatsOf(gid), g=S.games[gid]||{}, loose=scenesLoose(gid);
  const looseHtml=loose.length?`<div class="maprole">Scenes not on a beat</div>`+loose.map(([sid,s])=>mapSceneRow(sid,s)).join(""):"";
  if(gid==="series"||isReleased(gid))
    return (beats.length?beats.map(([bid,b],i)=>mapBeatHtml(bid,b,false,gid==="series"?0:i+1)).join(""):`<p class="muted small">No beats.</p>`)+looseHtml;
  const rd=readiness(gid), sp=g.spine||{};
  const item=k=>rd.items.find(i=>i.key===k)||{};
  const missing=SPINE_FIELDS.filter(([k])=>!String(sp[k]||"").trim()&&!item(k).parked), spParked=SPINE_FIELDS.filter(([k])=>item(k).parked);
  let h=missing.length?`<div class="slot" style="margin-top:10px"><span class="what"><b>Spine:</b> ${missing.map(([,l])=>esc(l)).join(", ")} still blank</span><button class="btn" data-act="map-spine" data-id="${gid}">Fill in</button></div>`:"";
  if(spParked.length) h+=`<div class="slot parked"${missing.length?"":' style="margin-top:10px"'}><span class="what">⏸ Spine, finding as you go: ${spParked.map(([,l])=>esc(l)).join(", ")}</span><button class="btn" data-act="map-spine" data-id="${gid}">Review</button></div>`;
  for(const [role,label] of MAP_ROLES){
    const list=beats.filter(([,b])=>(b.role||"")===role);
    if(role==="stinger"&&!list.length) continue;
    h+=`<div class="maprole">${label}</div>`+list.map(([bid,b])=>mapBeatHtml(bid,b,true)).join("");
    if(role===""){
      const mid=list.filter(([,b])=>mapSolid(b)).length;
      if(mid<MIDDLE_MIN) h+=item("middle").parked?mapParked(gid,item("middle"),"The rest of the middle"):`<div class="slot"><span class="what">${list.length?`${mid} of ${MIDDLE_MIN} middle beats at maybe or canon`:"No middle beats yet"}</span><button class="btn" data-act="map-newbeat" data-id="${gid}">Add beat</button><button class="btn" data-act="rd-brain" data-id="${gid}">Brainstorm</button>${parkBtn(gid,item("middle"))}</div>`;
    } else if(item("role_"+role).parked){
      h+=mapParked(gid,item("role_"+role),label);
    } else if(!list.length){
      const others=beats.filter(([,b])=>!b.role);
      h+=`<div class="slot"><span class="what">No ${role} beat yet</span><button class="btn" data-act="map-newbeat" data-id="${gid}" data-role="${role}">Add beat</button>${others.length?`<select class="field rolepick" data-rolepick="${role}" data-game="${gid}" aria-label="Pick the ${role} beat"><option value="">…or pick one you already have</option>${others.map(([id,b])=>`<option value="${id}">${esc(String(b.title||"").slice(0,70))}</option>`).join("")}</select>`:""}${item("role_"+role).key?parkBtn(gid,item("role_"+role)):""}</div>`;
    }
  }
  h+=looseHtml;
  const need=rd.items.find(i=>i.key==="loose");
  if(need&&!need.done) h+=`<div class="maprole">Loose ends this game needs</div><div class="small">${renderText(need.detail).replace(/^<p>|<\/p>$/g,"")}</div>`;
  return h+`<div class="btnrow">${rd.done<rd.total?`<button class="btn primary" data-act="rd-interview" data-id="${gid}">Interview me on the gaps</button>`:""}<button class="btn" data-act="map-spine" data-id="${gid}">Spine and readiness</button></div>`;
}
function mapGameHtml(gid,g){
  const open=mapOpen().has(gid), nb=beatsOf(gid).length, ns=Object.values(S.scenes).filter(s=>s.game===gid).length;
  const live=gid!=="series"&&!isReleased(gid), rd=live?readiness(gid):null, gaps=live?mapGaps(gid).length:0;
  const line=gid==="series"?"Beats that span more than one game.":(String((g.spine||{}).logline||"").trim()||(live?"":String(g.note||"").trim()));
  const pct=live?Math.round(rd.done/rd.total*100):0;
  return `<div class="card mapgame"><button type="button" class="maphead" data-act="map-toggle" data-id="${gid}" aria-expanded="${open}"><span class="car" aria-hidden="true">${open?"▾":"▸"}</span><span class="main"><span class="title">${esc(g.name)}</span><span class="meta">${gid==="series"?"":live?`<span class="tag">Ready ${rd.done} of ${rd.total} ·</span>${rd.parkedN?`<span class="tag">${rd.parkedN} parked ·</span>`:""}`:`<span class="st canon">released</span>`}<span class="tag">${nb} beat${nb===1?"":"s"}</span><span class="tag">· ${ns} scene${ns===1?"":"s"}</span>${gaps?`<span class="tag gap">· ${gaps} gap${gaps===1?"":"s"}</span>`:""}</span>${line?`<span class="snip">${esc(plainSnip(line))}</span>`:live?`<span class="snip">No logline yet.</span>`:""}</span></button>${live?`<div class="prog" role="img" aria-label="${pct} percent ready"><span style="width:${pct}%"></span></div>`:""}${open?`<div class="mapbody">${mapGameBody(gid)}</div>`:""}</div>`;
}
function mapHtml(){
  const games=gamesSorted().filter(([gid])=>gid!=="series"), ng=nextGame();
  const rdn=ng?readiness(ng):null, endOpen=!!rdn&&rdn.items.some(i=>(i.key==="role_ending"||i.key==="handoff")&&!i.done);
  let h="";
  if(ng){ const gaps=mapGaps(ng), g=gaps[0];
    h+= g ? `<div class="banner gold"><span><b>Next gap in ${esc(gameName(ng))}:</b> ${esc(mapGapText(g,ng))}<br><span class="small muted">${gaps.length} gap${gaps.length===1?"":"s"} between here and a written game.</span></span><span class="mapgo">${mapGapBtn(g,ng)}</span></div>`
          : `<div class="banner gold"><span><b>${esc(gameName(ng))} has no gaps left.</b> Nothing on the checklist is open and every settled beat has a scene.${rdn.parkedN?" "+rdn.parkedN+" left open on purpose.":""}</span></div>`; }
  const n=games.length+1, nm="Pip "+n;
  h+=`<div class="list">${games.map(([gid,g])=>mapGameHtml(gid,g)).join("")}`
    +`<div class="slot big"><span class="what"><b>Game ${n}:</b> not started.<br><span class="small">${endOpen?"Waiting on how "+esc(gameName(ng))+" ends and what it hands on.":"Later games stay blank until there’s something for them to follow on from."}</span></span><button class="btn" data-act="map-addgame" data-name="${nm}">${S.armed==="mapgame"?"Tap again to add "+nm:"Start "+nm}</button></div>`
    +(S.games.series&&beatsOf("series").length?mapGameHtml("series",S.games.series):"")+`</div>`;
  return h+`<p class="small muted">Dashed boxes are things that don’t exist yet. Tap a game to fold it away.</p>`;
}
async function extraAct(act,el,id){
  if(act.startsWith("exp-")&&await expAct(act,el)) return true;
  if((act.startsWith("sc-")||act.startsWith("rd-"))&&await scriptAct(act,el,id)) return true;
  if(act.startsWith("pl-")&&await playAct(act,el,id)) return true;
  if(act.startsWith("gap-")&&await gapAct(act,el)) return true;
  if((act.startsWith("cl-")||act==="tr-state")&&claimsAct(act,el)) return true;
  if(act.startsWith("spec-")&&await specAct(act,el,id)) return true;
  if(act.startsWith("hk-")&&hookAct(act,el)) return true;
  switch(act){
    case "rd-park": {
      const g=S.games[id], k=el.dataset.k; if(!g||!k) return true; const pk={...(g.parked||{})}; const on=!pk[k];
      for(const x of (k==="role_ending"?[k,"ending"]:[k])){ if(on) pk[x]=true; else delete pk[x]; }
      const n={...g}; if(Object.keys(pk).length) n.parked=pk; else delete n.parked;
      if(await put("games",id,n)) toast(on?"Parked. It’s out of the gap count until you un-park it.":"Un-parked."); return true; }
    case "map-toggle": { const o=mapOpen(); if(o.has(id)) o.delete(id); else o.add(id); store("mapopen",JSON.stringify([...o])); render(); return true; }
    case "map-spine": S.beatsGame=id; store("beatsgame",id); S.beatsMode="spine"; S.mapBack=true; render(); window.scrollTo(0,0); return true;
    case "map-back": S.mapBack=false; S.beatsMode="map"; store("beatsmode","map"); render(); window.scrollTo(0,0); return true;
    case "map-newbeat": { const d={game:id}; if(el.dataset.role) d.role=el.dataset.role; newDraft("beats",d); return true; }
    case "map-addgame": {
      if(S.armed!=="mapgame"){ S.armed="mapgame"; render(); return true; }
      S.armed=null; const name=el.dataset.name||"New game"; const gid=uniqueId(name); const order=Math.max(0,...Object.values(S.games).map(g=>g.order||0))+1;
      if(await put("games",gid,{name,order,note:"",created:now()})){ mapOpen().add(gid); store("mapopen",JSON.stringify([...mapOpen()])); toast("Added "+name+" as "+gid); }
      return true; }
    case "spine-save": {
      const g=S.games[id]; if(!g) return true; const sp={...(g.spine||{})}, by={...(g.spine_by||{})};
      for(const [k] of SPINE_FIELDS){ const elx=$("#sp-"+k); if(!elx) continue; const v=elx.value.trim(); if(v!==(sp[k]||"")){ delete by[k]; } if(v) sp[k]=v; else delete sp[k]; }
      if(await put("games",id,{...g,spine:sp,spine_by:by})) toast("Spine saved."); return true; }
    case "rd-interview": if(S.route==="ask") syncAsk(); Object.assign(S.ask,{mode:"interview",game:id,text:"",err:"",formOpen:true}); go("ask"); return true;
    case "rd-tellback": Object.assign(S.ask,{mode:"tellback",game:id,text:"",err:"",formOpen:true}); go("ask"); return true;
    case "rd-brain": Object.assign(S.ask,{mode:"brain",game:id,target:"",err:"",formOpen:true,text:"The middle of the game: what happens between the opening and the climax. One beat per option, each a set piece that could be a handful of screens."}); go("ask"); return true;
    case "ledger-open": S.looseTab="ledger"; store("loosetab","ledger"); go("loose"); return true;
    case "make-canon": {
      const f=find(id); if(!f) return true;
      if(!el.dataset.now&&S.armed!=="canon:"+id){ S.armed="canon:"+id; render(); return true; }
      S.armed=null;
      if(await putRec(id,{status:"canon",canon_at:now(),canon_by:"mike",updated:now()},["propose_canon"])) toast("Canon."); return true; }
    case "propose-dismiss": await putRec(id,{},["propose_canon"]); return true;
    case "pending-apply": {
      const f=find(id); if(!f||!f.rec.pending) return true; const after={...f.rec.pending.after,updated:now()}; delete after.pending;
      if(await put(f.type,f.id,after)) toast("Applied."); return true; }
    case "pending-discard": if(await putRec(id,{},["pending"])) toast("Discarded."); return true;
    case "gloss-keep": case "gloss-cut": case "gloss-keepall": case "wording-ok": {
      const f=find(id); if(!f) return true; const r=f.rec; const gl=liveGloss(r);
      if(act==="gloss-keepall"||act==="wording-ok"){ await putRec(id,{vetted:true},["gloss","audited"]); toast("Marked as yours."); return true; }
      const g=gl[+el.dataset.i]; if(g===undefined) return true;
      const rest=gl.filter(x=>x!==g);
      if(act==="gloss-keep"){ await putRec(id,rest.length?{gloss:rest}:{vetted:true},rest.length?[]:["gloss"]); return true; }
      if(r.status==="canon"&&!S.unlocked.has(id)){ toast("Unlock it first."); return true; }
      const body=String(r.body||"").split(g).join("").replace(/[ \t]{2,}/g," ").replace(/ +([.,;:])/g,"$1").replace(/\(\s*\)/g,"").replace(/\n{3,}/g,"\n\n").trim();
      await putRec(id,rest.length?{body,gloss:rest,updated:now()}:{body,vetted:true,updated:now()},rest.length?[]:["gloss"]); toast("Cut."); return true; }
    case "wording-audit": if(S.auditing) return true; await auditWording(id); return true;
    case "rename-start": { const f=find(id); if(f&&f.rec.status==="canon"&&!S.unlocked.has(id)){ toast("Unlock it first."); return true; } S.renaming=id; render(); setTimeout(()=>$("#rn-new")?.focus(),30); return true; }
    case "rename-cancel": S.renaming=null; render(); return true;
    case "rename-go": {
      const nid=slug($("#rn-new")?.value||""); if(!nid){ toast("It needs an id."); return true; }
      if(nid===id){ S.renaming=null; render(); return true; }
      if(idTaken(nid)&&!(S.aliases[nid]&&S.aliases[nid].to===id)){ toast(`The id ${nid} is taken.`); return true; }
      el.disabled=true; const ok=await renameRecord(id,nid); S.renaming=null;
      if(ok){ toast("Renamed. The old id still works."); history.replaceState(null,"","#r-"+toHash(nid)); route(); } else render();
      return true; }
    case "hl-clear-inbox": {
      const k=el.dataset.k; const x=healthIssues().find(i=>i.key===k); if(!x) return true;
      if(S.armed!=="hl:"+k){ S.armed="hl:"+k; render(); return true; }
      S.armed=null;
      const ops=x.items.filter(i=>i.inbox&&S.inbox[i.inbox]).map(i=>({type:"inbox",id:i.inbox,before:clone(S.inbox[i.inbox]),after:null}));
      if(ops.length){ try{ await commit(ops,"Cleared "+ops.length+" inbox note"+(ops.length>1?"s":"")+" (health check)"); toast("Cleared "+ops.length+". Undo is in the inbox."); }catch(e){} }
      return true; }
  }
  return false;
}
document.addEventListener("change",async e=>{
  const t=e.target; if(!t||!t.dataset) return;
  if(t.dataset.need){ const id=t.dataset.need; const l=S.loose[id]; if(!l) return; const n={...l,updated:now()}; if(t.value) n.needed_by=t.value; else delete n.needed_by; if(await put("loose",id,n)) toast(t.value?(isParked(n)?"Parked until "+needLabel(t.value)+".":"Needed by "+needLabel(t.value)+"."):"Cleared."); return; }
  if(t.dataset.rolepick){ const role=t.dataset.rolepick, gid=t.dataset.game, bid=t.value; if(!bid||!S.beats[bid]) return;
    for(const [oid,b] of beatsOf(gid)) if(oid!==bid&&b.role===role&&role!=="stinger"){ const n={...b}; delete n.role; await put("beats",oid,n); }
    if(await put("beats",bid,{...S.beats[bid],role,updated:now()})) toast("Marked as the "+role+"."); }
});

boot();
</script>
