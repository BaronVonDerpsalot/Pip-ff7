<html lang="en">

<meta name="theme-color" content="#5537c9">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%235537c9%22/%3E%3Crect x=%222%22 y=%225%22 width=%225%22 height=%227%22 fill=%22%23f4efe2%22/%3E%3Crect x=%229%22 y=%225%22 width=%225%22 height=%227%22 fill=%22%23f4efe2%22/%3E%3Crect x=%227%22 y=%226%22 width=%222%22 height=%227%22 fill=%22%2333228a%22/%3E%3Crect x=%222%22 y=%2212%22 width=%225%22 height=%221%22 fill=%22%2333228a%22/%3E%3Crect x=%229%22 y=%2212%22 width=%225%22 height=%221%22 fill=%22%2333228a%22/%3E%3Crect x=%223%22 y=%227%22 width=%223%22 height=%221%22 fill=%22%23bdb2e2%22/%3E%3Crect x=%223%22 y=%229%22 width=%223%22 height=%221%22 fill=%22%23bdb2e2%22/%3E%3Crect x=%2210%22 y=%227%22 width=%223%22 height=%221%22 fill=%22%23bdb2e2%22/%3E%3Crect x=%2210%22 y=%229%22 width=%222%22 height=%221%22 fill=%22%23bdb2e2%22/%3E%3Crect x=%2212%22 y=%221%22 width=%221%22 height=%223%22 fill=%22%23f0c84a%22/%3E%3Crect x=%2211%22 y=%222%22 width=%223%22 height=%221%22 fill=%22%23f0c84a%22/%3E%3Crect x=%2212%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%23fff6cf%22/%3E%3Crect x=%2214%22 y=%224%22 width=%221%22 height=%221%22 fill=%22%23f0c84a%22/%3E%3Crect x=%229%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%23bdb2e2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efecf6; --surface:#fbfaff; --sunk:#e4dfef; --ink:#241d3a; --muted:#665e82; --line:#d6cee8;
  --accent:#5537c9; --accent-ink:#ffffff; --gold:#a87700; --gold-soft:#f6e6ad; --maybe:#a85a1f; --brain:#7e769c;
  --danger:#b3261e; --ok:#2e7d4f;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pixel:"Pixelify Sans", "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111e; --surface:#211a2e; --sunk:#1a1426; --ink:#ece6f6; --muted:#a59cbf; --line:#372e4b;
    --accent:#ab98ff; --accent-ink:#15111e; --gold:#f0c84a; --gold-soft:#3d3110; --maybe:#eba267; --brain:#958daf;
    --danger:#ff8a80; --ok:#7fd3a0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15111e; --surface:#211a2e; --sunk:#1a1426; --ink:#ece6f6; --muted:#a59cbf; --line:#372e4b;
  --accent:#ab98ff; --accent-ink:#15111e; --gold:#f0c84a; --gold-soft:#3d3110; --maybe:#eba267; --brain:#958daf;
  --danger:#ff8a80; --ok:#7fd3a0; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 10px}
.mark{font:700 20px/1 var(--pixel);letter-spacing:.5px;margin-right:auto;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mark .halo{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:24px}
.gamesel{height:40px;max-width:112px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 6px;font-size:14px}

.modelrow{display:flex;gap:8px;margin:2px 0 10px}
.modelrow .field{flex:1;min-width:0;margin:0}
.fwinfo{margin:8px 0 4px;font-size:14px;color:var(--muted)}
.fwinfo summary{cursor:pointer;line-height:1.45}
.fwinfo ol{margin:8px 0 0;padding-left:1.4em;color:var(--ink)}
.fwinfo li{margin-bottom:4px}
.pitches{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pitches:empty{display:none}
.pitch{border-left:4px solid var(--accent)}
.pitch.kept{opacity:.82;border-left-color:var(--gold)}
.pitch.skipped{display:flex;align-items:center;gap:10px;padding:6px 12px;border-left-color:var(--line)}
.pitch.skipped .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:line-through}
.pitch .phead{display:flex;gap:10px;align-items:baseline}
.pitch .phead .title{font-weight:700}
.pitch .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:3px 0 6px}
.pitch .btnrow{margin:10px 0 0}
.pn{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.by{margin-top:6px}
.origin{margin-top:6px}
.jokebits{margin:10px 0}
.jokebits div{margin:3px 0}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.tabs button .g{font-size:18px;line-height:1.2}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"] .g{color:var(--accent)}
.tabs .count{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;font-weight:700}

main{max-width:var(--mw,720px);margin:0 auto;padding:14px 14px 24px;zoom:var(--zoom,1)}
h1,h2{font-family:var(--pixel);font-weight:700;line-height:1.15;margin:0}
h1{font-size:26px}
h2{font-size:19px;margin:22px 0 8px}
.viewhead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.viewhead h1{margin-right:auto}
.muted{color:var(--muted)}
.small{font-size:14px}
.banner{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner.warn{border-color:var(--danger);color:var(--danger)}

.btn{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px 14px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.gold{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.btn:disabled{opacity:.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* status marks: border style carries the status; canon wears a halo */
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:1px 9px;border-radius:999px;border:1.5px dotted var(--brain);color:var(--brain);white-space:nowrap}
.st.maybe{border-style:dashed;border-color:var(--maybe);color:var(--maybe)}
.st.canon{border:1.5px solid var(--gold);color:var(--ink);background:var(--gold-soft)}
.st.canon::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold)}
.tag{font-size:13px;color:var(--muted);white-space:nowrap}
.id{font:13px var(--mono);color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 6px;border:0;word-break:break-all}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card.canon{border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:inherit}
.row .glyph{width:26px;flex:none;text-align:center;font-size:18px;color:var(--muted);line-height:1.4}
.row .main{min-width:0;flex:1}
.row .title{font-weight:700}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.row .snip{color:var(--muted);font-size:14px;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}

/* capture */
.capture{display:flex;gap:8px;align-items:flex-end;margin-bottom:14px}
.capture textarea{flex:1}
textarea,input[type=text],input[type=number],input[type=search],select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:52px;line-height:1.45}
textarea.body{min-height:200px}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:9px 4px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 auto;min-width:72px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}

.inboxitem .txt{white-space:normal}
.inboxitem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inboxitem .acts .btn{min-height:34px;padding:3px 10px;font-size:14px}
.from{font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 6px}

/* record */
.rechead{display:flex;gap:10px;align-items:flex-start}
.rechead .glyph{font-size:24px;color:var(--muted);line-height:1.2}
.recmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.prose{max-width:66ch;line-height:1.6}
.prose p{margin:0 0 .8em}
.prose ul,.prose ol{margin:0 0 .8em;padding-left:1.4em}
.prose ol li::marker{font-weight:700}
.mention{text-decoration:none;border-bottom:1.5px dotted currentColor;font-weight:700}
.mention,.prose,.answer,.card,.opt .t,.tick .t,.notes a,.notes div,.linklist a,.banner,.you{overflow-wrap:anywhere;word-break:break-word}
.mention.st-canon{color:var(--ink);border-bottom:2px solid var(--gold)}
.mention.missing{color:var(--danger);border-bottom-style:dashed;cursor:pointer}
.lockbar{display:flex;align-items:center;gap:10px;border:1px solid var(--gold);background:var(--gold-soft);border-radius:10px;padding:8px 10px;margin:10px 0}
.lockbar span{flex:1;font-size:14px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.imgs figure{margin:0;position:relative}
.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);image-rendering:pixelated;background:var(--sunk)}
.imgs button{position:absolute;top:4px;right:4px;border:0;border-radius:8px;background:var(--surface);font-size:12px;padding:2px 7px}
.linklist{display:flex;flex-direction:column;gap:6px}
.linklist a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.linklist a .rel{margin-left:auto;font-size:12px;color:var(--muted)}

/* picker + mention bar */
.picker .sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.picker .sel span{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:8px;padding:3px 4px 3px 9px;font-size:14px}
.picker .sel button{border:0;background:none;font-size:15px;padding:0 5px;color:var(--muted)}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px;background:var(--surface)}
.sugg button{border:0;background:none;text-align:left;padding:9px 12px;font-size:15px;display:flex;gap:8px;align-items:center}
.sugg button+button{border-top:1px solid var(--line)}
.sugg .id{margin-left:auto}
.mbar{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.mbar button{flex:none;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:14px}

/* beats */
.beat .ord{font:600 13px var(--mono);color:var(--muted);width:26px;flex:none;text-align:center;padding-top:3px}
.beat .move{display:flex;flex-direction:column;gap:4px}
.beat .move button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;font-size:13px}
.links .lk{color:var(--muted)}
.warn{color:var(--danger);font-size:13px}
.graphwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
.graphwrap svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:22px;border-top:2px solid var(--muted);vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed}
.legend i.r{border-top-color:var(--danger)}

/* ask */
.answer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;min-height:60px}
.answer.thinking{color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.you{margin:18px 0 0 auto;width:fit-content;max-width:88%;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:9px 13px;white-space:pre-wrap;line-height:1.45}
.you+.answer{margin-top:8px}
.sizehint{align-self:center}
.filterbox{margin-bottom:10px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips:empty{display:none}
.fchip{display:inline-flex;align-items:center;background:var(--sunk);border-radius:8px;padding:2px 2px 2px 9px;font-size:13px}
.fchip.bad{color:var(--danger);outline:1px dashed var(--danger)}
.fchip button{border:0;background:none;color:var(--muted);padding:2px 7px;font-size:13px}
.mbar:empty{display:none}
.tagchip{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--ink)}
.replybox{margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
.notes .chg{display:flex;align-items:center;justify-content:space-between;gap:8px}
.notes .chg a{border:0;padding:0;background:none;border-radius:0}
.notes .chg.held{border-left-color:var(--danger)}
.chgbtn{padding:2px 10px;font-size:13px;min-height:0}
.chglist{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
.chgrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.chgrow .t{flex:1;min-width:0;font-size:14px}
.chgrow.undone .t{color:var(--muted);text-decoration:line-through}
.notes a,.notes div{font-size:14px;border-left:3px solid var(--accent);padding:4px 10px;background:var(--sunk);border-radius:0 8px 8px 0;text-decoration:none;color:var(--ink)}

.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0 2px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:44px;font:inherit;line-height:1.4}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-transform:uppercase}
.opt .t{flex:1;min-width:0}
.opt .mlabel{font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.else{border-style:dashed;color:var(--muted)}
.optbox{margin:-2px 0 4px 34px;padding:4px 0 2px}
.optbox textarea{width:100%}
.ticks{display:flex;flex-direction:column;gap:8px;margin:10px 0 2px}
.tick{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;min-height:44px;line-height:1.4;cursor:pointer}
.tick input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.tick .t{flex:1;min-width:0}
.tick .mlabel{font-weight:600}

.script{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.sline{background:var(--sunk);border-radius:10px;padding:8px 12px;line-height:1.5}
.sline .who{display:block;font-weight:700;font-size:13px;color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:.03em;margin-bottom:1px}
.sline.narr{background:transparent;border:1px dashed var(--line)}
.sline .stext p{margin:0}
.sline .tag{display:inline-block;margin:4px 6px 0 0}
.lineed{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;margin:0 0 10px}
.lineedtop{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lineedtop select{flex:1;min-width:0}
.lineedtop .move{display:flex;gap:4px;flex:none}

/* tab sub-menus */
.tabs button .car{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:8px;line-height:1;opacity:.5}
.tmwrap{position:fixed;left:0;right:0;top:0;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);z-index:30;background:rgba(10,6,20,.18)}
.tmenu{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);min-width:210px;max-width:calc(100vw - 16px);max-height:64vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(10,6,20,.3);display:flex;flex-direction:column}
.tmenu button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px;font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:center;min-height:42px}
.tmenu button .tg{width:18px;flex:none;text-align:center;color:var(--muted)}
.tmenu button .n{margin-left:auto;padding-left:12px;color:var(--muted);font-size:13px}
.tmenu button[aria-pressed="true"]{background:var(--sunk);font-weight:700}
.tmenu button[aria-pressed="true"] .tg{color:var(--accent)}
.tmenu .sep{height:1px;background:var(--line);margin:5px 8px;flex:none}
.tmenu .hd{font-size:12px;color:var(--muted);padding:6px 12px 2px}
.crumb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--ink);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewhead h1:has(+ .crumb){margin-right:0}
.viewhead .crumb{margin-right:auto}
.ptree .pkids{margin:8px 0 0 14px;padding-left:10px;border-left:1.5px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.ptree .pnode.dim>.card{opacity:.5}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,6,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px 12px}
.sheet{background:var(--surface);border-radius:14px;padding:14px;width:100%;max-width:560px;border:1px solid var(--line)}
.sheet h2{margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: no-preference){
  .answer.thinking{animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.55}}
}
.sharebox{margin-top:4px}
.sharedprev{border-left:3px solid var(--gold);padding-left:10px;margin:8px 0}
.banner.gold{background:var(--gold-soft);border-color:var(--gold);display:flex;gap:10px;align-items:center;justify-content:space-between}
.idea{border-left:4px solid var(--gold)}
.ideastate{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.gchips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px}
.gchips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sealed{color:var(--muted);font-style:italic}
body:not(.moded) .tabs,body:not(.moded) .top .iconbtn,body:not(.moded) #gamesel{visibility:hidden}
.guest #gamesel,.guest .top [data-to="search"],.guest .top [data-to="more"]{display:none}
.reqbox{margin-top:10px}
.reqcard .reqopt{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.reqcard .reqopt p{margin:6px 0}
.verdict{font-size:12px;border-radius:6px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
.verdict.v-fits{border-color:#2f8a4f;color:#2f8a4f}
.verdict.v-clashes{border-color:var(--danger);color:var(--danger)}
.verdict.v-decided{border-color:var(--maybe);color:var(--maybe)}
.verdict.v-unknown{color:var(--muted)}
.thintag{font-size:12px;color:var(--gold);border:1px dashed var(--gold);border-radius:6px;padding:0 6px}
.guest .tabs{grid-template-columns:repeat(2,1fr)}
mark.gloss{background:var(--gold-soft);color:inherit;border-bottom:2px dashed var(--gold);padding:0 1px;border-radius:2px}
.glossbox,.pendbox{margin-top:12px;border-style:dashed;border-color:var(--gold)}
.glossrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;margin-top:8px}
.glossrow .q{font-size:14px;flex:1;min-width:0;overflow-wrap:anywhere}
.gb{display:flex;gap:6px;flex:none}
.banner.gold .gb{flex-wrap:wrap;justify-content:flex-end}
.sealed{border-left:3px solid var(--gold);padding:2px 0 2px 10px;margin:8px 0;color:var(--muted)}
.rdcard{margin-bottom:6px}
.prog{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:8px 0 10px;border:1px solid var(--line)}
.prog span{display:block;height:100%;background:var(--gold)}
.rdrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rdrow .tick{flex:none;width:22px;text-align:center;font-weight:700;color:var(--muted)}
.rdrow.done .tick{color:var(--gold)}
.rdrow .main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.rdrow .title{font-weight:700}
.rdrow.done .title{font-weight:400}
.rolepick,.needsel{font-size:14px;padding:6px 8px;margin-top:4px}
.hlcard{margin-bottom:12px}
.hlcard .title{font-weight:700}
.hlcard .n{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--line);border-radius:999px;font-size:13px;padding:0 6px;margin-left:4px}
.hlrow{border-top:1px solid var(--line);padding:8px 0}
.hlrow .main{display:flex;flex-direction:column;gap:3px;min-width:0;overflow-wrap:anywhere}
.ledrow{margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.ledrow .title{font-weight:700;color:inherit}

/* story map */
.mapgame{padding:0;overflow:hidden}
.maphead{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:12px;color:inherit;font:inherit;cursor:pointer}
.maphead .car{flex:none;width:18px;color:var(--muted);line-height:1.5}
.maphead .main{min-width:0;flex:1;display:flex;flex-direction:column}
.maphead .title{font-weight:700;font-size:17px}
.maphead .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.maphead .snip{color:var(--muted);font-size:14px;margin-top:4px}
.mapgame .prog{margin:0 12px 10px}
.mapbody{border-top:1px solid var(--line);padding:2px 12px 12px}
.maprole{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.mapbeat{display:block;text-decoration:none;color:inherit;border-left:3px solid var(--line);padding:5px 0 5px 10px;margin:6px 0 4px}
.mapbeat.canon{border-left-color:var(--gold)}
.mapbeat .title{display:block;font-weight:700}
.mapbeat .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.mapscene{display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-decoration:none;color:var(--ink);font-size:14px;margin:3px 0 3px 13px;padding:6px 9px;border-radius:8px;background:var(--sunk)}
.mapscene .t{font-weight:700}
.slot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;margin:4px 0;color:var(--muted);font-size:14px}
.slot .what{flex:1;min-width:130px}
.slot .btn{min-height:36px;padding:4px 12px;font-size:14px}
.slot .rolepick{flex-basis:100%;margin:0}
.slot.sub{margin-left:13px}
.slot.big{padding:12px}
.slot.parked{border-style:solid;background:var(--sunk)}
.rdrow .btn{align-self:flex-start}
.tag.gap{color:var(--danger)}
.mapgo{flex:none}

/* script room */
body.scripting .tabs,body.reading .tabs,body.reading .top{display:none}
body.scripting,body.reading{padding-bottom:0}
:root{--spl:36%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--spl:74%}}
:root[data-theme="dark"]{--spl:74%}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.schead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.schead .main{flex:1;min-width:0}
.schead h1{font-size:22px;overflow-wrap:anywhere}
.schead .back{flex:none;width:42px;padding:0;display:grid;place-items:center;font-size:24px;text-decoration:none;color:var(--ink)}
.scmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.scpage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px 16px;margin:6px 0 12px;flex:1 0 auto}
body.scripting main{display:flex;flex-direction:column;min-height:calc(100dvh / var(--zoom,1) - 58px / var(--zoom,1))}
body.reading .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 70px)}
.scl{padding:9px 8px;border-radius:9px;cursor:pointer;margin:1px 0}
.scl:hover,.scl:active{background:var(--sunk)}
.scl .who{text-align:center;font:700 15px/1.25 var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--h,260) 58% var(--spl))}
.scl .par{text-align:center;font-size:13px;color:var(--muted);font-style:italic}
.scl .say{max-width:28em;margin:2px auto 0;padding:0 7%;font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.scl.narr .say{padding:0 2px;max-width:none;font-style:italic;color:var(--muted)}
.scl .after{display:flex;gap:10px;justify-content:center;font-size:12px;color:var(--muted);margin-top:3px}
.scl .after .warnt{color:var(--maybe)}
.ment{color:var(--accent);font-weight:700}
.scins{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;border:1.5px dashed var(--accent);border-radius:9px;padding:6px 10px;margin:6px 0;font-size:14px;color:var(--accent)}
.sclink{border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;font-size:14px;padding:4px 2px}
.scblank{text-align:center;padding:30px 12px;color:var(--muted)}
.scblank p{margin:4px 0}
.scedit{margin:8px 0;border-color:var(--accent);border-width:1.5px}
.scedit textarea{font-size:17px}
.btn.danger{color:var(--danger,#c0392b)}
.sccomp{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);margin:0 -14px -24px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 18px rgba(0,0,0,.10)}
.sccomp .chips{padding-bottom:6px}
.spchip{font-weight:700;color:hsl(var(--h,260) 58% var(--spl));border-color:currentColor}
.spchip.narr{color:var(--muted);border-color:var(--line);font-style:italic;font-weight:400}
.spchip[aria-pressed="true"]{background:hsl(var(--h,260) 58% var(--spl));color:var(--surface);border-color:hsl(var(--h,260) 58% var(--spl))}
.spchip.narr[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.scmore{flex:none;width:auto;font-size:14px;color:var(--muted);padding:5px 10px;appearance:auto}
.scrow{display:flex;gap:8px;align-items:flex-end}
.scta{flex:1;min-width:0}
.scta textarea{font-size:17px;min-height:52px;resize:vertical;display:block}
.scadd{flex:none;min-height:52px;min-width:64px}
.scnote:empty{display:none}
.scnote{margin-top:4px}
/* script room: draft lines from roleplay */
.scl.draft{border:1.5px dashed var(--maybe);margin:4px 0}
.scl .after .dtag{color:var(--maybe);font-weight:700}
.draftbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--maybe);border-radius:10px;padding:8px 10px;margin:4px 0 6px;font-size:14px;color:var(--maybe)}
.draftbar span{flex:1;min-width:150px}
.draftbar .btn{min-height:38px;padding:4px 12px;font-size:14px}
.schead .btn.sm{padding:0 12px;flex:none}
/* tell it back: gap cards */
.gapcard{display:block;margin:10px 0;padding:10px 10px 6px;border:1.5px dashed var(--maybe);border-radius:12px;background:var(--surface);font-style:normal}
.gapcard.closed{border-style:solid;border-color:var(--line);background:var(--sunk)}
.gaphd{display:block;font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--maybe);margin-bottom:4px}
.gapcard.closed .gaphd{color:var(--muted)}
.gapq{display:block;padding:6px 0 8px;border-top:1px solid var(--line)}
.gapq:first-of-type{border-top:0}
.gapt{display:block;font-weight:700;font-size:16px;line-height:1.4;margin-bottom:6px}
.gapq textarea{display:block;width:100%;font-size:17px;min-height:64px}
.gaprow{display:flex;gap:8px;align-items:center;margin-top:6px}
.gaprow .field{flex:1;min-width:0;margin:0;font-size:15px}
.gapbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gapbtns .btn{min-height:44px}
.gapans{display:block;font-size:15px}
.gapq.done .gapt,.gapq.parked .gapt,.gapq.skipped .gapt{font-weight:400;color:var(--muted);margin-bottom:2px}
.gapq.done .gapans{color:var(--ok)}
.gapq.done .gapwhere{color:var(--muted)}
.gapq.parked .gapans,.gapq.skipped .gapans{color:var(--muted)}
.gapchip{display:inline-block;font-size:14px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.gapfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.gapfoot span{flex:1;min-width:140px}
/* roleplay */
.plsec{display:flex;align-items:center;gap:8px;font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 4px 4px}
.plsec::after{content:"";flex:1;border-top:1px solid var(--line)}
.plctx{opacity:.6}
.plctx .scl{cursor:default}
.plctx .scl:hover{background:none}
.plmore{display:block;margin:0 auto}
.plwho{text-align:center;font-size:14px;color:var(--muted);margin:0 0 6px}
.plwho b{font-family:var(--pixel);letter-spacing:.04em;color:hsl(var(--h,260) 58% var(--spl))}
.pll{display:grid;grid-template-columns:minmax(0,1fr) 46px;align-items:center;border-radius:9px}
.pll.kept{background:var(--gold-soft)}
.pll .scl{margin:0}
.keep{width:46px;height:46px;border:0;background:none;font-size:24px;line-height:1;color:var(--muted);border-radius:10px;cursor:pointer;padding:0}
.keep[aria-pressed="true"]{color:var(--gold)}
.keep.done{display:grid;place-items:center;color:var(--ok);font-size:20px;cursor:default}
.pldir{text-align:center;font-size:15px;font-style:italic;color:var(--accent);padding:8px 10px;margin:4px 0;border-radius:9px;cursor:pointer}
.pldir:active{background:var(--sunk)}
.plpend .scl{opacity:.85;cursor:default}
.pldots{display:flex;gap:6px;justify-content:center;padding:10px}
.pldots span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:pld 1s infinite ease-in-out}
.pldots span:nth-child(2){animation-delay:.15s}.pldots span:nth-child(3){animation-delay:.3s}
@keyframes pld{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pldots span{animation:none;opacity:.6}}
.plerr{margin:8px 0}
.pltools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pldropchip{font-weight:700;color:var(--gold);border-color:var(--gold)}
.pldrop p{margin:2px 0 6px}
.pldrop select{font-size:16px}
.plsetup .chips{flex-wrap:wrap;overflow:visible}
.plsetup .spchip{font-size:16px;padding:8px 14px}
.plsetup textarea{font-size:17px}
.plstart{min-width:140px;min-height:52px;font-size:18px}
/* table read */
.rd{display:flex;flex-direction:column;min-height:calc(100dvh / var(--zoom,1) - 40px)}
.rdtop{display:flex;gap:10px;align-items:center}
.rdt{flex:1;min-width:0}
.rdtitle{font:700 17px/1.2 var(--pixel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdn{font:600 13px var(--mono);color:var(--muted);flex:none}
.rd .prog{margin:10px 0 8px}
.prog span{transition:width .2s}
.rdstage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:10px 0 6px;cursor:pointer;user-select:none;-webkit-user-select:none}
.rdpast{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.rdpast p{margin:0;color:var(--muted);font-size:15px;line-height:1.4;opacity:.75}
.rdpast p:last-child{opacity:1}
.rdpast p.narr{font-style:italic}
.rdpast b{font-family:var(--pixel);letter-spacing:.04em;color:hsl(var(--h,260) 58% var(--spl))}
.tbox{position:relative;background:#120e1d;color:#f5f1ff;border:3px solid #e9e2ff;border-radius:12px;box-shadow:0 0 0 3px #120e1d,0 10px 24px rgba(0,0,0,.25);padding:18px 18px 26px;margin-top:14px;min-height:120px}
.tbox.narr{background:#1d1a26;border-style:dashed}
.tbox.narr .ttext{font-style:italic;color:#d9d3ea}
.tname{position:absolute;top:-15px;left:14px;background:hsl(var(--h,260) 60% 72%);color:#120e1d;font:700 15px/1 var(--pixel);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:7px;border:2px solid #120e1d}
.ttext{font-size:21px;line-height:1.45;overflow-wrap:anywhere}
.ttext .ment{color:#c9bcff}
.tnext{position:absolute;right:14px;bottom:6px;font-size:14px;color:#e9e2ff;animation:tblink 1s steps(2) infinite}
@keyframes tblink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tnext{animation:none}}
.rdflag{display:inline-block;align-self:flex-start;font:600 12px var(--mono);color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.rdflag.warn{color:var(--maybe)}
.rdafter{display:flex;gap:6px;flex-wrap:wrap}
.rdcardx{margin:auto 0;text-align:center;padding:20px 6px}
.rdcardx h1{font-size:28px;margin:6px 0 8px}
.rdcardx p{margin:4px 0}
.rdcast{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
.rdgo{margin-top:26px !important;font-weight:700;color:var(--accent)}
.rdbtns{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:20px auto 0}
.rdhint{text-align:center;font-size:13px;color:var(--muted);padding:6px 0 calc(4px + env(safe-area-inset-bottom,0px))}
.claims{display:grid;gap:8px;margin:6px 0 4px}
.claim{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.claim .prose p{margin:0 0 4px}
.cl-sub{margin:-6px 0 6px}
.holder{font-style:italic}
.card.truth{margin-top:14px;border-color:var(--gold)}
.card.truth .prose{margin-top:6px}
.claimed{display:grid;gap:6px;margin:0 0 12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.claimed .btn{justify-self:start}
.wrapchips{flex-wrap:wrap;overflow:visible}
.wrapchips .chip b{font-weight:700;margin-left:2px}
.stally .tl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:6px;font-size:15px}
.stally .warn{color:var(--danger)}
h3.sarea{font-family:var(--pixel);font-size:15px;margin:14px 0 2px;color:var(--muted)}
h3.sarea:first-child{margin-top:2px}
.card.spec .title code.sid,code.sid{font:600 13.5px var(--mono);word-break:break-all}
.card.sstate{margin-left:22px;border-style:dashed}
.sflag{font-size:12px;border-radius:6px;padding:0 6px;border:1px solid var(--line);white-space:nowrap}
.sflag.stale{border-color:var(--danger);color:var(--danger)}
.sflag.done{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}

<body>
<header class="top">
  <div class="mark"><span class="halo" aria-hidden="true"></span>Story Room</div>
  <select class="gamesel" id="gamesel" aria-label="Game filter"></select>
  <button class="iconbtn" data-act="go" data-to="search" aria-label="Search">⌕</button>
  <button class="iconbtn" data-act="go" data-to="more" aria-label="More">⋯</button>
  <button class="iconbtn primary" data-act="capture" aria-label="Capture an idea">+</button>
</header>
<main id="view"><p class="muted">Opening the room…</p></main>
<nav class="tabs" aria-label="Sections">
  <button data-act="tab" data-to="inbox"><span class="g">✉</span>Inbox<span class="count hidden" id="c-inbox"></span></button>
  <button data-act="tab" data-to="bible"><span class="g">¶</span>Bible<span class="car">▴</span></button>
  <button data-act="tab" data-to="beats"><span class="g">⟿</span>Beats<span class="car">▴</span></button>
  <button data-act="tab" data-to="loose"><span class="g">?</span>Loose ends<span class="count hidden" id="c-loose"></span><span class="car">▴</span></button>
  <button data-act="tab" data-to="ask"><span class="g">✎</span>Write<span class="count hidden" id="c-write"></span><span class="car">▴</span></button>
</nav>
<div id="overlay"></div>
<div id="tabmenu"></div>
<div id="toast" class="toast hidden" role="status"></div>
<input type="file" id="filepick" accept="image/*" class="hidden">

<script>
"use strict";
const COL = {games:"games", entries:"entries", beats:"beats", scenes:"scenes", loose:"loose_ends", inbox:"inbox", pitches:"pitches", changes:"claude_changes", aliases:"aliases", specs:"specs", manifest:"asset_manifest"};
const MANIFEST_COL="asset_manifest";
const KINDS = [["character","Character","◉"],["place","Place","▲"],["item","Item","◆"],["faction","Faction","✦"],["lore","Lore / rule","¶"],["event","Event","✶"],["joke","In-joke","☺"]];
const KIND = Object.fromEntries(KINDS.map(k=>[k[0],{label:k[1],g:k[2]}]));
const STATUSES = ["brainstorm","maybe","canon"];
const LE_KINDS = [["question","Question"],["thread","Open thread"],["setup","Setup, no payoff"],["contradiction","Contradiction"]];
const LE_KIND = Object.fromEntries(LE_KINDS);
const TYPE_LABEL = {entries:"Entry", beats:"Beat", scenes:"Scene", loose:"Loose end", inbox:"Inbox", games:"Game"};

const S = {
  games:{}, entries:{}, beats:{}, scenes:{}, loose:{}, inbox:{}, pitches:{}, changes:{}, aliases:{}, specs:{}, manifest:{}, shelfTab:"open",
  loaded:new Set(), seen:new Set(), sampleChecked:false, db:null, sample:null, assets:null, downloads:null,
  unlocked:new Set(), filterGame:"all", bibleKind:"all", bibleStatus:"all",
  beatsGame:null, beatsMode:"list", looseTab:"open", draft:null, armed:null, closing:null,
  ask:{mode:"brain", target:"", text:"", game:"", fw:"save_the_cat", n:5, write:false, busy:false, err:"", ctrl:null, task:"", label:"", thread:[], follow:"", formOpen:true}, model:{pick:"auto", effort:""},
  readOnly:false, slow:false, noDb:false, route:"", q:{search:"",bible:"",loose:"",askun:"",askfree:""}
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => new Date().toISOString();
const lineKey = () => Math.random().toString(36).slice(2,6);
function bodyText(r){ return (r.body||"")+(Array.isArray(r.lines)&&r.lines.length?"\n"+r.lines.map(l=>l.text||"").join("\n"):""); }
function slug(s){ return String(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60).replace(/_+$/,""); }
const toHash = id => id.replace(/_/g,"-");
const fromHash = h => h.replace(/-/g,"_");
function store(k,v){ try{ localStorage.setItem("sr_"+k,v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem("sr_"+k); }catch(e){ return null; } }

/* ---------- settings (kept per device in this browser) ---------- */
const SET_DEFAULTS={defGame:"last",startView:"last",font:"atkinson",size:"100",width:"720",pixel:"on",newStatus:"brainstorm",fsAuto:"off"};
const FONTS={atkinson:["Atkinson Hyperlegible",null],system:["System",'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'],serif:["Serif",'Georgia,"Iowan Old Style","Times New Roman",serif'],mono:["Mono",'"JetBrains Mono",ui-monospace,Menlo,monospace']};
const SIZES=[["90","Small"],["100","Normal"],["115","Large"],["130","Huge"]];
const WIDTHS=[["720","Narrow"],["960","Wide"],["100%","Full"]];
const START_VIEWS=[["last","Last used"],["inbox","Inbox"],["bible","Bible"],["beats","Beats"],["loose","Loose ends"],["ask","Write"]];
function loadSettings(){ try{ S.set=Object.assign({},SET_DEFAULTS,JSON.parse(recall("settings")||"{}")); }catch(e){ S.set={...SET_DEFAULTS}; } }
function saveSettings(){ store("settings",JSON.stringify(S.set)); }
function applySettings(){
  const st=document.documentElement.style, c=S.set, f=FONTS[c.font]||FONTS.atkinson;
  if(f[1]) st.setProperty("--body",f[1]); else st.removeProperty("--body");
  if(c.pixel==="off") st.setProperty("--pixel","var(--body)"); else st.removeProperty("--pixel");
  st.setProperty("--zoom",String((+c.size||100)/100));
  st.setProperty("--mw",c.width==="100%"?"100%":(+c.width||720)+"px");
}
function setSeg(key,opts){ return `<div class="seg">${opts.map(([v,l])=>`<button data-act="setopt" data-k="${key}" data-v="${v}" aria-pressed="${S.set[key]===v}">${l}</button>`).join("")}</div>`; }
function settingsHtml(){
  const th=document.documentElement.dataset.theme||"system";
  const dg=S.set.defGame, dgv=(dg==="last"||dg==="all"||S.games[dg])?dg:"last";
  const gOpts=[["last","Last used"],["all","All games"],...gamesSorted().map(([id,g])=>[id,g.name])].map(([v,l])=>`<option value="${esc(v)}" ${dgv===v?"selected":""}>${esc(l)}</option>`).join("");
  const vOpts=START_VIEWS.map(([v,l])=>`<option value="${v}" ${S.set.startView===v?"selected":""}>${l}</option>`).join("");
  const fOpts=Object.entries(FONTS).map(([v,f])=>`<option value="${v}" ${S.set.font===v?"selected":""}>${f[0]}</option>`).join("");
  const fsOn=!!document.fullscreenElement;
  const fs=document.fullscreenEnabled
    ? `<div class="btnrow"><button class="btn" data-act="fullscreen">${fsOn?"Exit fullscreen":"Go fullscreen"}</button></div><label class="f">Open in fullscreen <span class="muted small">starts on your first tap</span></label>${setSeg("fsAuto",[["on","On"],["off","Off"]])}`
    : `<p class="small muted">Fullscreen isn’t available in this view. It may work if the page is opened on its own in a browser.</p>`;
  return `<h2>Settings</h2>
  <p class="small muted">Saved on this device.</p>
  <label class="f" for="set-defGame">Default game <span class="muted small">what the room opens on</span></label>
  <select class="field" id="set-defGame" data-set="defGame">${gOpts}</select>
  <label class="f" for="set-startView">Start screen</label>
  <select class="field" id="set-startView" data-set="startView">${vOpts}</select>
  <label class="f">New records start as</label>
  ${setSeg("newStatus",[["brainstorm","Brainstorm"],["maybe","Maybe"]])}
  <label class="f">Theme</label>
  <div class="seg">${["system","light","dark"].map(x=>`<button data-act="theme" data-v="${x}" aria-pressed="${th===x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
  <label class="f" for="set-font">Font</label>
  <select class="field" id="set-font" data-set="font">${fOpts}</select>
  <label class="f">Pixel headings</label>
  ${setSeg("pixel",[["on","On"],["off","Off"]])}
  <label class="f">Text size</label>
  ${setSeg("size",SIZES)}
  <label class="f">Page width <span class="muted small">only matters on a wide screen</span></label>
  ${setSeg("width",WIDTHS)}
  <label class="f">Screen</label>
  ${fs}
  <div class="btnrow"><button class="btn ghost" data-act="resetset">Reset settings</button></div>`;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.add("hidden"),2600); }
function ago(iso){
  if(!iso) return ""; const d=(Date.now()-Date.parse(iso))/1000;
  if(d<60) return "just now"; if(d<3600) return Math.floor(d/60)+"m ago"; if(d<86400) return Math.floor(d/3600)+"h ago";
  if(d<86400*7) return Math.floor(d/86400)+"d ago"; return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function find(id){
  const T=["entries","beats","scenes","loose","inbox","games"];
  for(const t of T) if(S[t][id]) return {type:t, rec:S[t][id], id};
  const al=S.aliases&&S.aliases[id];
  if(al&&al.to&&al.to!==id) for(const t of T) if(S[t][al.to]) return {type:t, rec:S[t][al.to], id:al.to};
  return null;
}
function titleOf(type, r){
  if(!r) return "";
  if(type==="entries") return r.name||"Untitled";
  if(type==="beats"||type==="loose"||type==="scenes") return r.title||"Untitled";
  if(type==="inbox") return (r.text||"").split("\n")[0].slice(0,70);
  if(type==="games") return r.name||"";
  return "";
}
function gamesSorted(){ return Object.entries(S.games).sort((a,b)=>(a[1].order??99)-(b[1].order??99)); }
function gameName(id){ return S.games[id]?.name || id || "—"; }
function idTaken(id){ return !!find(id); }
function uniqueId(base){ let b=slug(base)||"untitled"; if(!idTaken(b)) return b; let n=2; while(idTaken(b+"_"+n)) n++; return b+"_"+n; }
function inboxId(){ const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return uniqueId("idea_"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())); }
function isPlace(id){ return S.entries[id]?.kind==="place"; }
function placeParent(id){ const p=S.entries[id]?.within; return p&&p!==id&&isPlace(p)?p:""; }
function placeChain(id){ const out=[], seen=new Set([id]); let p=placeParent(id); while(p&&!seen.has(p)){ out.unshift(p); seen.add(p); p=placeParent(p); } return out; }
function placeKids(id){ return Object.entries(S.entries).filter(([cid,e])=>e.kind==="place"&&cid!==id&&placeParent(cid)===id).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"")); }
function placeDescendants(id){ const out=new Set(); const walk=x=>{ for(const [cid] of placeKids(x)) if(cid!==id&&!out.has(cid)){ out.add(cid); walk(cid); } }; if(id) walk(id); return out; }
function placePath(id){ return [...placeChain(id),id].map(x=>S.entries[x]?.name||x).join(" › "); }
function gameOrd(g){ return S.games[g]?.order??99; }
function beatsAt(id){ return Object.entries(S.beats).filter(([,b])=>b.place===id).sort((a,b)=>gameOrd(a[1].game)-gameOrd(b[1].game)||(a[1].order??0)-(b[1].order??0)); }
function scenesAt(id){ return Object.entries(S.scenes).filter(([,s])=>s.place===id).sort((a,b)=>(a[1].title||"").localeCompare(b[1].title||"")); }
function inGame(r){ return S.filterGame==="all" || r.game===S.filterGame; }
function statusMark(s){ s=STATUSES.includes(s)?s:"brainstorm"; return `<span class="st ${s}">${s}</span>`; }
function glyphFor(type,r){ if(type==="scenes") return "❝"; if(type==="entries") return KIND[r.kind]?.g||"¶"; if(type==="beats") return "⟿"; if(type==="loose") return r.open===false?"✓":"?"; if(type==="inbox") return "✉"; return "·"; }
const MENTION_RE = /\[\[([a-z0-9_]+)(?:\|([^\]\n]+))?\]\]/g;

function mentionHtml(id,label){
  if(S.guestRender||S.mode==="guest"||S.preview) return guestMention(id,label);
  const f=find(id);
  if(f && f.type!=="inbox"){
    const st=f.rec.status||"brainstorm";
    return `<a class="mention st-${st}" href="#r-${toHash(id)}">${label?label:esc(titleOf(f.type,f.rec))}</a>`;
  }
  return `<a class="mention missing" data-act="create-missing" data-id="${id}" title="Not in the bible yet">${label||id}</a>`;
}
const OPT_RE=/^\s*\(?([a-e])[.)]\s+/i;
function optLead(html){ const d=document.createElement("div"); d.innerHTML=html; let t=(d.textContent||"").replace(/\s+/g," ").trim().split(/[:\u2014\u2013]/)[0].trim(); return t.length>80?t.slice(0,80)+"\u2026":t; }
function optBoxHtml(P){
  const el=P.k==="else";
  return `<div class="optbox"><label class="f" for="a-pick-note" style="margin-top:0">${el?"What are you thinking instead?":"Anything to add? (optional)"}</label>
    <textarea id="a-pick-note" data-mention="1" rows="3" placeholder="${el?"Your own take, in your words":"A tweak, a reason, a caveat\u2026"}">${esc(P.note||"")}</textarea>
    <div class="btnrow"><button type="button" class="btn primary" data-act="opt-send">Send</button><button type="button" class="btn ghost" data-act="opt-cancel">Cancel</button></div></div>`;
}
function optsHtml(run,turn){
  const P=S.ask.pick&&S.ask.pick.turn===turn?S.ask.pick:null;
  const btns=run.map(l=>{
    const m=OPT_RE.exec(l), k=m[1].toLowerCase();
    const body=l.slice(m[0].length).replace(/<a\b[^>]*>([\s\S]*?)<\/a>/g,'<span class="mlabel">$1</span>');
    const on=!!P&&P.k===k;
    return `<button type="button" class="opt" data-act="opt-pick" data-turn="${turn}" data-k="${k}" data-lead="${esc(optLead(body))}" aria-pressed="${on}"><span class="k">${k}</span><span class="t">${body}</span></button>${on?optBoxHtml(P):""}`;
  });
  const onE=!!P&&P.k==="else";
  btns.push(`<button type="button" class="opt else" data-act="opt-pick" data-turn="${turn}" data-k="else" data-lead="" aria-pressed="${onE}"><span class="k">+</span><span class="t">Something else</span></button>${onE?optBoxHtml(P):""}`);
  return `<div class="opts" role="group" aria-label="Pick an option">${btns.join("")}</div>`;
}
function ticksHtml(run,turn){
  const T=S.ask.ticks&&S.ask.ticks.turn===turn?S.ask.ticks:null; const on=T?T.on:[];
  const rows=run.map((l,i)=>{
    const body=l.replace(/^\s*\d+[.)]\s/,"").replace(/<a\b[^>]*>([\s\S]*?)<\/a>/g,'<span class="mlabel">$1</span>');
    const num=(/^\s*(\d+)/.exec(l)||[])[1]||String(i+1);
    return `<label class="tick"><input type="checkbox" data-act="tick" data-turn="${turn}" data-i="${i}" data-n="${num}" data-lead="${esc(optLead(body))}" ${on.includes(i)?"checked":""}><span class="t">${body}</span></label>`;
  });
  return `<div class="ticks" role="group" aria-label="Tick the ones to do">${rows.join("")}<div class="btnrow"><button type="button" class="btn primary" data-act="ticks-send" data-turn="${turn}">Do the ticked ones</button><button type="button" class="btn ghost" data-act="ticks-all" data-turn="${turn}" data-count="${run.length}">Tick all</button></div></div>`;
}
function renderText(t, md, pick, loose){
  let h=esc(t||"").replace(MENTION_RE,(m,id,label)=>mentionHtml(id,label));
  if(md){ h=h.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/(^|\s)\*([^*\n]+)\*/g,"$1<em>$2</em>"); }
  return h.split(/\n{2,}/).map(par=>{
    const lines=par.split("\n").filter(l=>l.trim()!=="");
    if(!lines.length) return "";
    if(pick!=null && /^\s*(<strong>)?CHOICES:?(<\/strong>)?\s*$/.test(lines[0])){
      const run=lines.slice(1).filter(l=>OPT_RE.test(l));
      if(run.length>=2 && OPT_RE.exec(run[0])[1].toLowerCase()==="a") return optsHtml(run,pick);
    }
    if(pick!=null && /^\s*(<strong>)?TICKS:?(<\/strong>)?\s*$/.test(lines[0])){
      const run=lines.slice(1).filter(l=>/^\s*\d+[.)]\s/.test(l));
      if(run.length>=1) return ticksHtml(run,pick);
    }
    if(pick!=null && loose){
      let st=lines.length; while(st>0&&OPT_RE.test(lines[st-1])) st--;
      const run=lines.slice(st);
      if(run.length>=2&&OPT_RE.exec(run[0])[1].toLowerCase()==="a"){
        const lead=lines.slice(0,st);
        return (lead.length?"<p>"+lead.join("<br>")+"</p>":"")+optsHtml(run,pick);
      }
    }
    if(md && lines.length===1 && /^#{1,4}\s/.test(lines[0])) return `<p><strong>${lines[0].replace(/^#+\s/,"")}</strong></p>`;
    if(lines.every(l=>/^\s*\d+[.)]\s/.test(l))) return `<ol start="${parseInt(lines[0],10)}">`+lines.map(l=>"<li>"+l.replace(/^\s*\d+[.)]\s/,"")+"</li>").join("")+"</ol>";
    if(lines.every(l=>/^\s*[-*•]\s/.test(l))) return "<ul>"+lines.map(l=>"<li>"+l.replace(/^\s*[-*•]\s/,"")+"</li>").join("")+"</ul>";
    return "<p>"+lines.map(l=> md && /^#{1,4}\s/.test(l) ? "<strong>"+l.replace(/^#+\s/,"")+"</strong>" : l).join("<br>")+"</p>";
  }).join("");
}
function plainSnip(t){ return String(t||"").replace(MENTION_RE,(m,id,label)=>label||titleOf(find(id)?.type, find(id)?.rec)||id).replace(/\s+/g," ").trim(); }

function backlinks(id){
  const out=[]; const re=new RegExp("\\[\\["+id+"(\\||\\]\\])");
  for(const t of ["entries","beats","scenes","loose"]){
    for(const [rid,r] of Object.entries(S[t])){
      if(rid===id) continue;
      const rels=[];
      if(re.test(bodyText(r))) rels.push("mentions");
      if(t==="beats"&&(r.requires||[]).includes(id)) rels.push("requires it");
      if(t==="beats"&&(r.leads_to||[]).includes(id)) rels.push("leads to it");
      if(t==="loose"&&(r.links||[]).includes(id)) rels.push("linked");
      if(t==="beats"&&r.place===id) rels.push("happens here");
      if(t==="entries"&&r.within===id) rels.push("inside it");
      if(t==="entries"&&claimsOf(r).some(c=>claimBy(c).includes(id))) rels.push("holds a claim on it");
      if(t==="entries"&&r.hook&&r.hook.on===id) rels.push(r.hook.type==="belief"?"has a wrong belief about it":"hook touches it");
      if(t==="entries"&&r.kind==="character"&&r.place===id) rels.push("found here");
      if(t==="scenes"){ if(r.beat===id) rels.push("scene of it"); if(r.place===id) rels.push("set here"); if((r.lines||[]).some(l=>l.speaker===id)) rels.push("speaks in it"); }
      if(rels.length) out.push({type:t,id:rid,rec:r,rel:rels.join(", ")});
    }
  }
  return out;
}
function missingMentions(){
  const miss=new Map();
  for(const t of ["entries","beats","scenes","loose"]) for(const [rid,r] of Object.entries(S[t])){
    for(const m of bodyText(r).matchAll(MENTION_RE)) if(!find(m[1])||find(m[1]).type==="inbox"){ if(!miss.has(m[1])) miss.set(m[1],[]); miss.get(m[1]).push(rid); }
  }
  return miss;
}

/* ---------- tags + filter line ---------- */
const TYPE_ALIASES={entry:"entries",entries:"entries",beat:"beats",beats:"beats",scene:"scenes",scenes:"scenes",loose:"loose",looseend:"loose","loose-end":"loose",loose_end:"loose",le:"loose",inbox:"inbox",idea:"inbox"};
function normTag(t){ return String(t||"").toLowerCase().replace(/^#+/,"").trim().replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function allTags(){ const m=new Map(); for(const t of ["entries","beats","scenes","loose"]) for(const r of Object.values(S[t])) for(const g of r.tags||[]) m.set(g,(m.get(g)||0)+1); return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function tagsHtml(r){ return (r.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join(""); }
function resolveGame(v){
  v=String(v||"").toLowerCase().trim(); if(!v) return null; if(S.games[v]) return v;
  const s=slug(v);
  for(const [id,g] of gamesSorted()){ const n=(g.name||"").toLowerCase(); if(id===s||n===v||slug(n)===s||id.endsWith("_"+s)||n.endsWith(" "+v)) return id; }
  if(["series-wide","serieswide","all"].includes(v)) return "series";
  return null;
}
function resolveRecord(v,kind){
  const s=slug(v); if(!s) return null;
  const pools=["entries","beats","loose","scenes"]; const ok=(t,r)=>!kind||(t==="entries"&&r.kind===kind);
  for(const t of pools) if(S[t][s]&&ok(t,S[t][s])) return s;
  for(const pass of [0,1,2]) for(const t of pools) for(const [id,r] of Object.entries(S[t])){
    if(!ok(t,r)) continue; const n=slug(titleOf(t,r));
    if(pass===0 ? n===s : pass===1 ? (n.startsWith(s)||id.startsWith(s)) : n.includes(s)) return id;
  }
  return null;
}
function neighbourhood(id){
  const n=new Set([id]); backlinks(id).forEach(b=>n.add(b.id));
  const r=find(id)?.rec;
  if(r){ [...(r.requires||[]),...(r.leads_to||[]),...(r.links||[]),r.beat,r.place,r.within,...(r.lines||[]).map(l=>l.speaker)].filter(Boolean).forEach(x=>n.add(x)); for(const m of bodyText(r).matchAll(MENTION_RE)) n.add(m[1]); }
  return n;
}
function parseFilter(q){
  const P={games:new Set(),kinds:new Set(),statuses:new Set(),types:new Set(),tags:new Set(),subjects:new Set(),is:new Set(),text:[],parts:[]};
  const re=/(\w+):"([^"]*)"|(\w+):(\S+)|"([^"]*)"|(\S+)/g; let m;
  while((m=re.exec(q||""))){
    const raw=m[0]; let key=(m[1]||m[3]||"").toLowerCase(); let val=(m[2]??m[4]??m[5]??m[6]??"").trim();
    if(!key && val.startsWith("#")){ key="tag"; val=val.slice(1); }
    else if(!key && val.startsWith("@")){ key="about"; val=val.slice(1); }
    const part={raw,label:"",bad:false}; const lv=val.toLowerCase();
    if(key==="game"){ const g=resolveGame(val); if(g){ P.games.add(g); part.label="Game: "+gameName(g); } else { part.bad=true; part.label=`Game: ${val} (no such game)`; } }
    else if(key==="status"){ const s=lv&&STATUSES.find(x=>x.startsWith(lv)); if(s){ P.statuses.add(s); part.label="Status: "+s; } else { part.bad=true; part.label=`Status: ${val}?`; } }
    else if(key==="kind"){ const k=lv&&KINDS.find(k=>k[0].startsWith(lv)||k[1].toLowerCase().startsWith(lv)); if(k){ P.kinds.add(k[0]); part.label="Kind: "+k[1]; } else { part.bad=true; part.label=`Kind: ${val}?`; } }
    else if(key==="type"){ const t=TYPE_ALIASES[lv]; if(t){ P.types.add(t); part.label=TYPE_LABEL[t]+"s only"; } else { part.bad=true; part.label=`Type: ${val}?`; } }
    else if(key==="tag"){ const t=normTag(val); if(t){ P.tags.add(t); part.label="#"+t+(allTags().some(([x])=>x===t)?"":" (unused)"); part.bad=!allTags().some(([x])=>x===t); } else { part.bad=true; part.label="#?"; } }
    else if(key==="is"){ if(lv==="open"||lv==="closed"){ P.is.add(lv); part.label=lv==="open"?"Open loose ends":"Closed loose ends"; } else { part.bad=true; part.label=`is:${val}?`; } }
    else if(key==="about"||KIND[key]){
      const id=resolveRecord(val,KIND[key]?key:null);
      if(id){ P.subjects.add(id); const f=find(id); part.label="About: "+titleOf(f.type,f.rec); }
      else { part.bad=true; part.label=`About: ${val} (not found)`; }
    }
    else { P.text.push((key?raw:val).toLowerCase()); part.label="“"+(key?raw:val)+"”"; }
    P.parts.push(part);
  }
  P.empty=!P.parts.length;
  P.near=null;
  if(P.subjects.size){ P.near=new Set(); for(const s of P.subjects) neighbourhood(s).forEach(x=>P.near.add(x)); }
  P.desc=P.parts.filter(p=>!p.bad).map(p=>p.label).join(", ");
  return P;
}
function matchRec(type,id,r,P){
  if(P.types.size && !P.types.has(type)) return false;
  if(P.games.size && !P.games.has(r.game)) return false;
  if(P.kinds.size && !(type==="entries" && P.kinds.has(r.kind))) return false;
  if(P.statuses.size && (type==="inbox" || !P.statuses.has(r.status||"brainstorm"))) return false;
  if(P.tags.size && !(r.tags||[]).some(t=>P.tags.has(t))) return false;
  if(P.is.size && !(type==="loose" && P.is.has(r.open===false?"closed":"open"))) return false;
  if(P.near && !P.near.has(id)) return false;
  if(P.text.length){
    const hay=(titleOf(type,r)+" "+(bodyText(r)||r.text||"")+" "+(r.resolution||"")+" "+id+" "+(r.tags||[]).map(t=>"#"+t).join(" ")).toLowerCase();
    if(!P.text.every(w=>hay.includes(w)||hay.includes(w.replace(/ /g,"_")))) return false;
  }
  return true;
}
function filterSuggest(q){
  const w=(q||"").match(/(\S*)$/)[1]; if(!w) return [];
  const lw=w.toLowerCase(); let key="", v=lw;
  const km=lw.match(/^(\w+):(.*)$/);
  if(km){ key=km[1]; v=km[2]; } else if(lw.startsWith("#")){ key="tag"; v=lw.slice(1); } else if(lw.startsWith("@")){ key="about"; v=lw.slice(1); }
  const cap = key ? 8 : 3; const out=[];
  const group=(items)=>{ let n=0; for(const it of items){ if(n>=cap) break; if(it.tok.toLowerCase()===lw||out.some(o=>o.tok===it.tok)) continue; out.push(it); n++; } };
  const want=k=>!key||key===k;
  if(want("game")) group(gamesSorted().filter(([id,g])=>!v||id.includes(slug(v))||g.name.toLowerCase().includes(v)).map(([id,g])=>({tok:"game:"+id,label:g.name})));
  if(want("tag")) group(allTags().filter(([t])=>!v||t.includes(normTag(v))).map(([t])=>({tok:"#"+t,label:"#"+t})));
  if(want("status")) group(STATUSES.filter(s=>!v||s.startsWith(v)).map(s=>({tok:"status:"+s,label:s})));
  if(want("kind")) group(KINDS.filter(k=>!v||k[0].startsWith(v)).map(k=>({tok:"kind:"+k[0],label:k[1]+"s"})));
  if(want("type")) group([["entry","entries"],["beat","beats"],["scene","scenes"],["loose","loose"],["inbox","inbox"]].filter(([a])=>!v||a.startsWith(v)).map(([a,t])=>({tok:"type:"+a,label:TYPE_LABEL[t]+"s"})));
  if(want("is")) group(["open","closed"].filter(s=>!v||s.startsWith(v)).map(s=>({tok:"is:"+s,label:s+" loose ends"})));
  if((want("about")||KIND[key]) && (key||v.length>=2)){
    const recs=[];
    for(const t of ["entries","beats","scenes","loose"]) for(const [id,r] of Object.entries(S[t])){
      if(KIND[key]&&!(t==="entries"&&r.kind===key)) continue;
      const n=titleOf(t,r); if(v&&!(n.toLowerCase().includes(v)||id.includes(slug(v)))) continue;
      recs.push({tok:"@"+id,label:"About "+n,s:(n.toLowerCase().startsWith(v)?0:1)+(t==="entries"?0:1)});
    }
    group(recs.sort((a,b)=>a.s-b.s));
  }
  return out;
}

async function put(type,id,data){
  if(!S.db){ toast("Story data isn’t available here."); return false; }
  for(let attempt=0; attempt<2; attempt++){
    try{ await S.db.collection(COL[type]).doc(id).set(data); return true; }
    catch(e){
      if(e?.code==="unavailable" && attempt===0){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); continue; }
      writeErr(e); return false;
    }
  }
  return false;
}

function writeErr(e){
  const c=e?.code;

  else if(c==="quota_exceeded") toast("Storage is full: "+(e.message||"delete something first."));
  else if(c==="resource_exhausted") toast("Too many saves at once. Give it a second.");
  else toast("Couldn’t save ("+(c||"error")+").");
}

function route(){

  if(!h){ h=(S.set.startView!=="last"&&S.set.startView)||recall("view")||"inbox"; history.replaceState(null,"","#"+h); }
  S.route=h; S.armed=null; S.closing=null;
  if(!h.startsWith("script-")) S.sc=null;
  if(!h.startsWith("play-")) S.pl=null;
  if(["inbox","bible","beats","loose","ask"].includes(h)) store("view",h);
  if(h.startsWith("edit-")){ const id=fromHash(h.slice(5)); if(!S.draft || S.draft.id!==id || S.draft.isNew){ const f=find(id); S.draft = f ? draftFrom(f) : null; } }
  if(h==="new" && !S.draft){ history.replaceState(null,"","#inbox"); S.route="inbox"; }
  if(h.startsWith("specedit-")){ const sid=fromHash(h.slice(9)); if(!S.specDraft||S.specDraft.id!==sid||S.specDraft.isNew){ S.specDraft=S.specs[sid]?{id:sid,isNew:false,data:JSON.parse(JSON.stringify(S.specs[sid]))}:null; } }
  else if(h!=="specnew") S.specDraft=null;
  if(h==="specnew" && !S.specDraft){ history.replaceState(null,"","#specs"); S.route="specs"; }
  closeOverlay(); closeTabMenu();
  render();
  window.scrollTo(0,0);
  if(h.startsWith("script-")&&S.sc){ const k=S.scFocus; S.scFocus=null; scScrollTo(k||null); if(!k&&!(S.scenes[S.sc.id]?.lines||[]).length) setTimeout(()=>$("#sc-new")?.focus(),80); }
  if(h.startsWith("play-")&&S.pl&&plSess(S.pl.id)) scScrollTo(null);
}

function wrapText(t,n,max){
  const words=String(t||"").split(/\s+/); const lines=[]; let cur="";
  for(const w of words){ if((cur+" "+w).trim().length>n){ if(cur) lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }
  if(cur) lines.push(cur);
  if(lines.length>max){ lines.length=max; lines[max-1]=lines[max-1].slice(0,n-1)+"…"; }
  return lines;
}
function graphHtml(gid){
  const beats=beatsOf(gid);
  const nodes=new Map(); beats.forEach(([id,b])=>nodes.set(id,{id,b,ext:false}));
  const edges=[];
  const ensure=id=>{ if(!nodes.has(id)) nodes.set(id,{id,b:S.beats[id],ext:true}); };
  beats.forEach(([id,b])=>{
    (b.requires||[]).forEach(r=>{ ensure(r); edges.push({from:r,to:id,kind:"req"}); });
    (b.leads_to||[]).forEach(t=>{ ensure(t); edges.push({from:id,to:t,kind:"lead"}); });
  });
  const keys=[...nodes.keys()].sort((a,c)=>{ const A=nodes.get(a),C=nodes.get(c); return (A.ext-C.ext)||((A.b?.order??0)-(C.b?.order??0)); });
  const out=new Map(keys.map(k=>[k,[]])); edges.forEach(e=>out.get(e.from).push(e));
  const state=new Map(); const back=new Set();
  const dfs=u=>{ state.set(u,1); for(const e of out.get(u)){ const s=state.get(e.to); if(s===1) back.add(e); else if(!s) dfs(e.to); } state.set(u,2); };
  keys.forEach(k=>{ if(!state.get(k)) dfs(k); });
  const fwd=edges.filter(e=>!back.has(e));
  const indeg=new Map(keys.map(k=>[k,0])); fwd.forEach(e=>indeg.set(e.to,indeg.get(e.to)+1));
  const rank=new Map(keys.map(k=>[k,0])); const q=keys.filter(k=>indeg.get(k)===0);
  while(q.length){ const u=q.shift(); for(const e of fwd.filter(e=>e.from===u)){ rank.set(e.to,Math.max(rank.get(e.to),rank.get(u)+1)); indeg.set(e.to,indeg.get(e.to)-1); if(indeg.get(e.to)===0) q.push(e.to); } }
  const rows=[]; keys.forEach(k=>{ const r=rank.get(k); (rows[r]=rows[r]||[]).push(k); });
  const W=156,H=58,GX=14,GY=46,PAD=18;
  const pos=new Map();
  rows.forEach((row,ri)=>{
    if(ri>0){ row.sort((a,c)=>{ const bar=k=>{ const ps=fwd.filter(e=>e.to===k).map(e=>pos.get(e.from)?.i).filter(x=>x!=null); return ps.length?ps.reduce((s,x)=>s+x,0)/ps.length:99; }; return bar(a)-bar(c); }); }
    row.forEach((k,i)=>pos.set(k,{i,ri}));
  });
  const maxRow=Math.max(...rows.map(r=>r.length));
  const width=PAD*2+maxRow*W+(maxRow-1)*GX+60, height=PAD*2+rows.length*H+(rows.length-1)*GY;
  rows.forEach(row=>{ const rw=row.length*W+(row.length-1)*GX; const x0=(width-60-rw)/2; row.forEach((k,i)=>{ const p=pos.get(k); p.x=x0+i*(W+GX); p.y=PAD+p.ri*(H+GY); }); });
  let svgE="", svgN="";
  for(const e of edges){
    const a=pos.get(e.from), b=pos.get(e.to); const isBack=back.has(e);
    const cls=isBack?"var(--danger)":"var(--muted)"; const dash=e.kind==="lead"?' stroke-dasharray="6 5"':"";
    let d;
    if(!isBack && b.ri>a.ri){ const x1=a.x+W/2,y1=a.y+H,x2=b.x+W/2,y2=b.y; d=`M${x1},${y1} C${x1},${y1+GY*.6} ${x2},${y2-GY*.6} ${x2},${y2-4}`; }
    else { const x1=a.x+W,y1=a.y+H/2,x2=b.x+W,y2=b.y+H/2; const bulge=Math.max(a.x,b.x)+W+46; d=`M${x1},${y1} C${bulge},${y1} ${bulge},${y2} ${x2+4},${y2}`; }
    svgE+=`<path d="${d}" fill="none" stroke="${cls}" stroke-width="${isBack?2.2:1.6}"${dash} marker-end="url(#${isBack?"arrR":"arr"})"/>`;
  }
  for(const k of keys){
    const n=nodes.get(k), p=pos.get(k); const b=n.b; const st=b?.status||"brainstorm";
    const stroke= !b ? "var(--danger)" : st==="canon" ? "var(--gold)" : st==="maybe" ? "var(--maybe)" : "var(--brain)";
    const dash= !b ? ' stroke-dasharray="3 3"' : st==="maybe" ? ' stroke-dasharray="7 4"' : st==="brainstorm" ? ' stroke-dasharray="2 3"' : "";
    const fill= st==="canon"&&b ? "var(--gold-soft)" : "var(--surface)";
    const label= b ? b.title : k;
    const lines=wrapText(label,19,n.ext?1:2);
    const sub = !b ? "missing" : n.ext ? gameName(b.game) : "";
    const ty=p.y+(sub?20:(lines.length===1?33:24));
    svgN+=`<g data-act="${b?"open":"create-missing-beat"}" data-id="${k}" style="cursor:pointer">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${st==="canon"?2.2:1.6}"${dash}/>
      ${lines.map((l,i)=>`<text x="${p.x+W/2}" y="${ty+i*17}" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink)" font-family="Atkinson Hyperlegible, system-ui, sans-serif">${esc(l)}</text>`).join("")}
      ${sub?`<text x="${p.x+W/2}" y="${p.y+H-10}" text-anchor="middle" font-size="11.5" fill="${b?"var(--muted)":"var(--danger)"}" font-family="Atkinson Hyperlegible, system-ui, sans-serif">${esc(sub)}</text>`:""}
    </g>`;
  }
  const cyc=[...back].map(e=>`<div class="warn">⚠ Loop: ${mentionHtml(e.from)} ${e.kind==="req"?"is required by":"leads to"} ${mentionHtml(e.to)}, which already comes before it. If that’s a hard requirement, it’s a softlock.</div>`).join("");
  return `<div class="graphwrap"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Beat flow for ${esc(gameName(gid))}">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/></marker></defs>
    ${svgE}${svgN}</svg></div>
  <div class="legend"><span><i></i>requires</span><span><i class="d"></i>leads to</span><span><i class="r"></i>loop</span></div>${cyc}`;
}
async function beatMove(id,dir){
  const gid=S.beats[id]?.game; const list=beatsOf(gid); const i=list.findIndex(x=>x[0]===id); const j=i+dir;
  if(j<0||j>=list.length) return;
  // renumber the whole list in tens so swaps never collide
  const ids=list.map(x=>x[0]); [ids[i],ids[j]]=[ids[j],ids[i]];
  for(let k=0;k<ids.length;k++){ const b=S.beats[ids[k]]; const want=(k+1)*10; if(b.order!==want){ if(!await put("beats",ids[k],{...b,order:want,updated:now()})) return; } }
}

/* ---------- scenes ---------- */
function scenesOfBeat(bid){ return Object.entries(S.scenes).filter(([,s])=>s.beat===bid).sort((a,b)=>(a[1].order??0)-(b[1].order??0)||a[0].localeCompare(b[0])); }
function scenesLoose(gid){ const ids=new Set(beatsOf(gid).map(([id])=>id)); return Object.entries(S.scenes).filter(([,s])=>s.game===gid&&!ids.has(s.beat)).sort((a,b)=>(a[1].order??0)-(b[1].order??0)||a[0].localeCompare(b[0])); }
function scenesOrdered(){ const bo=id=>S.beats[id]?(S.beats[id].order??0):1e9; return Object.entries(S.scenes).map(([id,r])=>({id,...r})).sort((a,b)=>(a.game||"").localeCompare(b.game||"")||bo(a.beat)-bo(b.beat)||(a.order??0)-(b.order??0)||a.id.localeCompare(b.id)); }
function nextSceneOrder(beat,game,exceptId){ return Math.max(0,...Object.entries(S.scenes).filter(([sid,s])=>sid!==exceptId&&(beat?s.beat===beat:(!S.beats[s.beat]&&s.game===game))).map(([,s])=>s.order||0))+10; }
function speakerName(sp){ return sp?(S.entries[sp]?.name||sp):""; }
function sceneLineText(l){ return `${l.speaker||"NARRATION"}: ${l.text}${l.cond?` [only if ${l.cond}]`:""}${l.sets?` [sets ${l.sets}]`:""}${l.draft?" [draft from roleplay, not approved]":""}`; }
function sceneRowHtml(id,s,i,n){
  const nl=(s.lines||[]).length; const first=(s.lines||[]).find(l=>l.text);
  const snip=s.body?plainSnip(s.body):(first?(first.speaker?speakerName(first.speaker)+": ":"")+first.text:"");
  return `<div class="card row beat ${s.status==="canon"?"canon":""}">
    <span class="glyph">\u275d</span>
    <a class="main" href="#r-${toHash(id)}" style="text-decoration:none;color:inherit">
      <span class="title">${esc(s.title)}</span>
      <span class="meta">${statusMark(s.status)}<span class="tag">· ${nl} line${nl===1?"":"s"}</span>${s.place&&S.entries[s.place]?`<span class="tag">· ${esc(S.entries[s.place].name)}</span>`:""}</span>
      ${snip?`<span class="snip">${esc(String(snip).slice(0,160))}</span>`:""}
    </a>
    <span class="move"><button data-act="scenemove" data-id="${id}" data-dir="-1" aria-label="Move up" ${i===0?"disabled":""}>▲</button><button data-act="scenemove" data-id="${id}" data-dir="1" aria-label="Move down" ${i===n-1?"disabled":""}>▼</button></span>
  </div>`;
}
function scenesHtml(gid){
  const beats=beatsOf(gid), loose=scenesLoose(gid);
  const total=Object.values(S.scenes).filter(s=>s.game===gid).length;
  if(!beats.length&&!loose.length) return `<div class="empty">No beats for ${esc(gameName(gid))} yet, so nothing to hang scenes on. Add a beat first, or start a scene on its own.</div>`;
  let h=total?"":`<div class="empty" style="margin-bottom:12px">No scenes for ${esc(gameName(gid))} yet. A scene is the script for one beat: a few short lines, each with a speaker.</div>`;
  for(const [bid,b] of beats){
    const sc=scenesOfBeat(bid);
    h+=`<div class="scenehead"><h2><a href="#r-${toHash(bid)}" style="color:inherit;text-decoration:none">${esc(b.title)}</a></h2><button class="btn" data-act="newscene" data-beat="${bid}">Add scene</button></div>`;
    h+=sc.length?`<div class="list">${sc.map(([id,s],i)=>sceneRowHtml(id,s,i,sc.length)).join("")}</div>`:`<p class="muted small">No scenes yet.</p>`;
  }
  if(loose.length) h+=`<div class="scenehead"><h2>Not on a beat</h2></div><div class="list">${loose.map(([id,s],i)=>sceneRowHtml(id,s,i,loose.length)).join("")}</div>`;
  return h;
}
async function sceneMove(id,dir){
  const s=S.scenes[id]; if(!s) return;
  const list=S.beats[s.beat]?scenesOfBeat(s.beat):scenesLoose(s.game);
  const i=list.findIndex(x=>x[0]===id), j=i+dir; if(i<0||j<0||j>=list.length) return;
  const ids=list.map(x=>x[0]); [ids[i],ids[j]]=[ids[j],ids[i]];
  for(let k=0;k<ids.length;k++){ const sc=S.scenes[ids[k]]; const want=(k+1)*10; if(sc.order!==want){ if(!await put("scenes",ids[k],{...sc,order:want,updated:now()})) return; } }
}
function beatScenesHtml(bid){
  const sc=scenesOfBeat(bid);
  return `<h2>Scenes</h2>${sc.length?`<div class="linklist">${sc.map(([id,s])=>`<a href="#r-${toHash(id)}"><span>\u275d</span><span>${esc(s.title)}</span><span class="rel">${statusMark(s.status)}</span></a>`).join("")}</div>`:`<p class="muted small">No scenes yet.</p>`}`;
}
function sceneBodyHtml(id,r){
  const meta=[];
  if(r.beat) meta.push(`<span class="lk">Beat</span> ${mentionHtml(r.beat)}`);
  if(r.place) meta.push(`<span class="lk">Place</span> ${mentionHtml(r.place)}`);
  let h=meta.length?`<div class="links" style="margin:6px 0 10px">${meta.join(" · ")}</div>`:"";
  const lines=r.lines||[];
  const nl=lines.filter(l=>l.text).length;
  h+=`<h2>Script</h2><div class="btnrow" style="margin-top:0"><button class="btn primary" data-act="sc-open" data-id="${id}">${nl?"Open the script":"Write the script"}</button>${nl?`<button class="btn" data-act="sc-read" data-id="${id}">▶ Table read</button>`:""}<button class="btn" data-act="pl-open" data-id="${id}">${plSess(id)?"🎭 Back to the roleplay":"🎭 Roleplay"}</button><button class="btn" data-act="draft-scene" data-id="${id}">Write lines with Claude</button></div>`;
  if(!lines.length) return h+`<p class="muted small">No lines yet.</p>`;
  const inl=t=>renderText(t).replace(/^<p>|<\/p>$/g,"");
  return h+`<div class="script">`+lines.map(l=>{
    const flags=(l.draft?`<span class="tag" style="color:var(--maybe)">draft</span>`:"")+(l.cond?`<span class="tag">if ${esc(l.cond)}</span>`:"")+(l.sets?`<span class="tag">sets ${esc(l.sets)}</span>`:"");
    return l.speaker
      ? `<div class="sline"><a class="who" href="#r-${toHash(l.speaker)}">${esc(speakerName(l.speaker))}</a><div class="stext">${inl(l.text)}</div>${flags}</div>`
      : `<div class="sline narr"><div class="stext"><em>${inl(l.text)}</em></div>${flags}</div>`;
  }).join("")+`</div>`;
}
function beatOptionsHtml(sel){
  let h=`<option value="">No beat yet</option>`;
  for(const [gid,g] of gamesSorted()){ const bs=beatsOf(gid); if(!bs.length) continue;
    h+=`<optgroup label="${esc(g.name)}">${bs.map(([id,b])=>`<option value="${id}" ${sel===id?"selected":""}>${esc(b.title)}</option>`).join("")}</optgroup>`; }
  if(sel&&!S.beats[sel]) h+=`<option value="${esc(sel)}" selected>${esc(sel)} (missing)</option>`;
  return h;
}
function placeOptionsHtml(sel,exclude,none){
  const ex=exclude||new Set();
  const ps=Object.entries(S.entries).filter(([id,e])=>e.kind==="place"&&!ex.has(id));
  let h=`<option value="">${esc(none||"No place")}</option>`;
  const gk=[...new Set(ps.map(([,e])=>e.game||"series"))].sort((a,b)=>gameOrd(a)-gameOrd(b));
  for(const g of gk){ const opts=ps.filter(([,e])=>(e.game||"series")===g).map(([id])=>[id,placePath(id)]).sort((a,b)=>a[1].localeCompare(b[1]));
    h+=`<optgroup label="${esc(gameName(g))}">${opts.map(([id,p])=>`<option value="${id}" ${sel===id?"selected":""}>${esc(p)}</option>`).join("")}</optgroup>`; }
  if(sel&&!isPlace(sel)) h+=`<option value="${esc(sel)}" selected>${esc(sel)} (missing)</option>`;
  return h;
}
function sceneFieldsHtml(r){
  return `<label class="f" for="d-beat">Beat <span class="muted small">the story moment this belongs to; the game follows it</span></label><select class="field" id="d-beat">${beatOptionsHtml(r.beat)}</select>

}
function speakerOptionsHtml(sel){

  let h=`<option value="">Narration / sign</option>`+chars.map(([id,e])=>`<option value="${id}" ${sel===id?"selected":""}>${esc(e.name)}</option>`).join("");

  else if(sel&&S.entries[sel].kind!=="character") h+=`<option value="${esc(sel)}" selected>${esc(S.entries[sel].name)}</option>`;

  </div>`).join("")+`</div><div class="btnrow"><button type="button" class="btn" data-act="line-add">Add line</button></div>`;

function draftSceneForBeat(bid){
  const b=S.beats[bid]; if(!b) return;
  if(!S.sample){ toast("Asking Claude isn’t available in this view."); return; }
  const have=scenesOfBeat(bid).map(([sid,s])=>`[[${sid}]] (${s.title})`).join(", ");
  const keepQ=S.q.askfree; S.q.askfree="@"+bid;
  Object.assign(S.ask,{mode:"free",target:"",err:"",formOpen:false,text:`Write a new scene for the beat [[${bid}]] (${b.title}).\n\n${recordDump(bid)}\n\n${have?"Scenes already on this beat: "+have+". Don't repeat them.":"No scenes on this beat yet."}\n\nFirst check what canon and the beat's requirements say about who is present, where, and what they know. Then create the scene with write_scene (no scene_id, beat set to ${bid}, pick a fitting place entry if there is one), as brainstorm, as short lines that fit a Zelda-style text box, each speaker in the voice their entry gives them. Afterwards, in a few numbered points, say what you decided and any flags you invented. Then, if the bible doesn't cover something I should rule on, finish with the single most important question as a CHOICES paragraph (2 to 4 real alternatives, in the CHOICES format from your rules). One question at a time; the next waits for my pick.`});
  go("ask"); askGo(); S.q.askfree=keepQ;
}
function draftScene(id){
  const s=S.scenes[id]; if(!s) return;
  if(!S.sample){ toast("Asking Claude isn’t available in this view."); return; }
  const keepQ=S.q.askfree; S.q.askfree="@"+id;
  Object.assign(S.ask,{mode:"free",target:"",err:"",formOpen:false,text:`Write the script for the scene [[${id}]] (${s.title}).\n\n${recordDump(id)}${s.beat&&S.beats[s.beat]?"\n\nIts beat:\n"+recordDump(s.beat):""}\n\nFirst check what canon and the beat's requirements say about who is present and what they know. Then write the lines with write_scene (replace the existing lines if there are any), as brainstorm, as short lines that fit a Zelda-style text box, each speaker in the voice their entry gives them. Afterwards, in a few numbered points, say what you decided and any flags you invented. Then, if the bible doesn't cover something I should rule on, finish with the single most important question as a CHOICES paragraph (2 to 4 real alternatives, in the CHOICES format from your rules). One question at a time; the next waits for my pick.`});
  go("ask"); askGo(); S.q.askfree=keepQ;
}
