});

/* ---------- Christine: spoiler-safe sharing ---------- */
/* Vault truth: share_overrides/<id> = {mode:"always"|"never"|absent, body?}. Default ("auto"): shared if the record is in a
   released game and links to nothing from an unreleased game. shared_entries holds only what Christine may read, sealed. */
const SHARE_COL="shared_entries", OV_COL="share_overrides", IDEA_COL="ideas";
Object.assign(S,{shared:{}, shareOv:{}, ideas:{}, mode:null, preview:false, shareEdit:null, gq:"", gkind:"all", sharedLoaded:false, ovLoaded:false, ideasLoaded:false, ideaAbout:"", ideaBlocked:false, chromeGuest:undefined, ownerNav:"", shareMigrated:false});
const GUEST_NAV=`<button data-act="go" data-to="world"><span class="g">◉</span>Pip’s world</button><button data-act="go" data-to="ideas"><span class="g">✎</span>Ideas</button>`;
const IDEA_STATE={sent:"Sent", read:"Mike’s read it", used:"Used somewhere"};
const KORD=Object.fromEntries([...KINDS.map((k,i)=>[k[0],i+1]),["beat",0],["loose",50]]);
const SHARE_TYPES=["entries","beats","loose"];
function gKind(k){ return k==="beat" ? {label:"Story beat", g:"⟿"} : k==="loose" ? {label:"Loose end", g:"?"} : (KIND[k]||{label:"Entry", g:"¶"}); }

async function setupSharing(db){
  let owner=false;
  try{ const u=await claude.use("user"); owner = u ? !!(await u.isOwner()) : false; }catch(e){ owner=false; }
  S.mode = owner ? "owner" : "guest";
  document.body.classList.add("moded");
  const sub=(col,key,flag)=>db.collection(col).onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S[key]=m; S[flag]=true;
    if(owner){ queueShareSync(); if(key==="requests") maybeRunRequests(); } scheduleRender();
  }, err=>{ S[flag]=true; if(err?.code==="revoked") S.noDb=true; scheduleRender(); });
  sub(SHARE_COL,"shared","sharedLoaded");
  sub(IDEA_COL,"ideas","ideasLoaded");
  sub(REQ_COL,"requests","reqLoaded");
  if(!owner){ render(); return false; }
  sub(OV_COL,"shareOv","ovLoaded");
  return true;
}

/* ----- the rule ----- */
function isReleased(g){ return !!S.games[g]?.released; }
function isUnreleasedGame(g){ return !!g && g!=="series" && !!S.games[g] && !S.games[g].released; }
function shareRec(id){ for(const t of SHARE_TYPES) if(S[t][id]) return {type:t, rec:S[t][id]}; return null; }
function linksOf(r){
  const out=new Set(); (String(r.body||"")+"\n"+String(r.resolution||"")).replace(MENTION_RE,(m,lid)=>{ out.add(lid); return m; });
  for(const k of ["requires","leads_to","links"]) for(const x of (r[k]||[])) out.add(x);
  for(const k of ["place","within","beat"]) if(r[k]) out.add(r[k]);
  for(const c of claimsOf(r)) for(const b of claimBy(c)) out.add(b);
  if(r.hook&&r.hook.on) out.add(r.hook.on);
  return out;
}
function blockersOf(id){ const f=shareRec(id); if(!f) return []; return [...linksOf(f.rec)].filter(l=>{ const g=find(l); return g && g.type!=="inbox" && (isUnreleasedGame(g.rec.game)||isUnreleasedGame(g.rec.reveal_from)); }); }
function autoEligible(id){ const f=shareRec(id); return !!f && isReleased(f.rec.game) && !isUnreleasedGame(f.rec.reveal_from) && !blockersOf(id).length; }
function shareMode(id){ return S.shareOv[id]?.mode||"auto"; }
function shouldShare(id){ const m=shareMode(id); return m==="never" ? false : m==="always" ? !!shareRec(id) : autoEligible(id); }
function desiredSet(){ const s=new Set(); for(const t of SHARE_TYPES) for(const id of Object.keys(S[t])) if(shouldShare(id)) s.add(id); return s; }

/* what Christine receives: links to anything not shared are sealed */
function sealText(t,set){ set=set||new Set(Object.keys(S.shared)); return String(t||"").replace(MENTION_RE,(m,lid,label)=> set.has(lid) ? m : (label ? label : "[sealed]")); }
function srcBody(id,ovBody){ const f=shareRec(id); if(ovBody!==undefined) return ovBody; const ov=S.shareOv[id]; if(ov&&typeof ov.body==="string") return ov.body; const r=f.rec; return (r.body||"")+(f.type==="loose"&&r.open===false&&r.resolution?"\n\nSettled: "+r.resolution:""); }
function pubDoc(id,set,ovBody){
  const f=shareRec(id), r=f.rec;
  const d={type:f.type, name:titleOf(f.type,r)||"Untitled", kind:f.type==="beats"?"beat":f.type==="loose"?"loose":(r.kind||"lore"), game:gameName(r.game), body:sealText(srcBody(id,ovBody),set), auto:shareMode(id)==="auto"};
  if(f.type==="loose") d.open=r.open!==false;
  if(f.type==="beats") d.order=(gameOrd(r.game)*100000)+(r.order||0);
  return d;
}
function samePub(a,b){ return !!a&&!!b&&["type","name","kind","game","body","auto","order","open"].every(k=>a[k]===b[k]); }
let shareTimer=null, shareBusy=false, shareAgain=false;
function queueShareSync(){ if(S.mode!=="owner"||S.twin) return; clearTimeout(shareTimer); shareTimer=setTimeout(syncShared,1200); }
function shareReady(){ return S.mode==="owner"&&S.db&&S.sharedLoaded&&S.ovLoaded&&["entries","beats","games","scenes","loose"].every(t=>S.loaded.has(t)); }
async function syncShared(){
  if(!shareReady()) return;
  if(shareBusy){ shareAgain=true; return; }
  shareBusy=true;
  try{
    // first run: anything shared before this version was shared by hand, so keep it shared by hand
    if(!S.shareMigrated){
      S.shareMigrated=true;
      for(const [id,p] of Object.entries(S.shared)) if(p.auto===undefined && shareRec(id) && !S.shareOv[id]?.mode){
        await S.db.collection(OV_COL).doc(id).set({...(S.shareOv[id]||{}),mode:"always",updated:now()});
        S.shareOv[id]={...(S.shareOv[id]||{}),mode:"always"};
      }
    }
    const want=desiredSet();
    for(const id of Object.keys(S.shared)) if(!want.has(id)){ try{ await S.db.collection(SHARE_COL).doc(id).delete(); }catch(e){} }
    for(const id of want){
      const nd=pubDoc(id,want);
      if(!samePub(nd,S.shared[id])){ try{ await S.db.collection(SHARE_COL).doc(id).set({...nd,updated:now()}); }catch(e){ writeErr(e); return; } }
    }
  } finally { shareBusy=false; if(shareAgain){ shareAgain=false; queueShareSync(); } }
}
async function setOv(id,patch){
  const cur={...(S.shareOv[id]||{})};
  for(const [k,v] of Object.entries(patch)){ if(v===undefined) delete cur[k]; else cur[k]=v; }
  const empty=!cur.mode && typeof cur.body!=="string";
  if(empty){ if(S.shareOv[id]) await S.db.collection(OV_COL).doc(id).delete(); delete S.shareOv[id]; }
  else { cur.updated=now(); await S.db.collection(OV_COL).doc(id).set(cur); S.shareOv[id]=cur; }
}
async function shareSave(id){
  const f=shareRec(id); if(!f||!S.db) return;
  const ta=$("#share-body"); const text=ta?ta.value:(f.rec.body||"");
  const custom = text.trim()!==String(f.rec.body||"").trim();
  try{
    await setOv(id,{body:custom?text:undefined, mode:autoEligible(id)?undefined:"always"});
    S.shareEdit=null; toast(custom?"Christine sees your edited version.":"Christine can see this."); render(); await syncShared();
  }catch(err){ writeErr(err); render(); }
}
async function shareSetMode(id,mode){
  try{
    if(mode==="off") await setOv(id,{mode:autoEligible(id)?"never":undefined, body:undefined});
    else if(mode==="auto") await setOv(id,{mode:undefined});
    else await setOv(id,{mode});
    S.shareEdit=null; render(); await syncShared();
    toast(shouldShare(id)?"Christine can see this.":"Hidden from Christine.");
  }catch(err){ writeErr(err); }
}
function renderShared(t){ const o=S.guestRender; S.guestRender=true; try{ return renderText(t).replace(/\[sealed\]/g,'<span class="sealed">[sealed]</span>'); } finally { S.guestRender=o; } }
function guestMention(id,label){
  const p=S.shared[id];
  if(p) return `<a class="mention st-canon" href="#r-${toHash(id)}">${label?label:esc(p.name)}</a>`;
  return `<span class="sealed">${label?label:"[sealed]"}</span>`;
}
function shareStatusLine(id,r){
  const m=shareMode(id), on=shouldShare(id), bl=blockersOf(id), rel=isReleased(r.game);
  if(m==="never") return "Kept hidden from her, by you.";
  if(m==="always") return "Shared by hand.";
  if(on) return `Shared automatically: ${esc(gameName(r.game))} is released.`;
  if(rel&&bl.length) return `Held back: it links to unreleased ${bl.map(x=>mentionHtml(x)).join(", ")}.`;
  return "Hidden from Christine.";
}
function sharePanelHtml(id,r){
  if(!S.sharedLoaded||!S.ovLoaded) return "";
  const pub=S.shared[id], ov=S.shareOv[id], on=shouldShare(id), m=shareMode(id), custom=ov&&typeof ov.body==="string";
  if(S.shareEdit===id){
    const start = custom ? ov.body : (r.body||"");
    return `<h2>Christine</h2><div class="card sharebox">
      <p class="small muted" style="margin-top:0">Cut anything she shouldn’t know yet. Leave it untouched and she gets your notes as they are, kept in step whenever you edit them. Links to anything she can’t see show up for her as [sealed].</p>
      <textarea id="share-body" rows="8" aria-label="What Christine sees">${esc(start)}</textarea>
      <div class="btnrow"><button class="btn primary" data-act="share-save" data-id="${id}">${on?"Save":"Share with Christine"}</button><button class="btn ghost" data-act="share-cancel">Cancel</button></div></div>`;
  }
  const btns=[];
  if(on){
    btns.push(`<button class="btn" data-act="share-edit" data-id="${id}">${custom?"Edit her version":"Edit what she sees"}</button>`);
    if(custom) btns.push(`<button class="btn ghost" data-act="share-live" data-id="${id}">Use my notes as they are</button>`);
    btns.push(`<button class="btn ghost danger" data-act="share-mode" data-v="off" data-id="${id}">${m==="auto"?"Keep this hidden":"Stop sharing"}</button>`);
  } else {
    btns.push(`<button class="btn" data-act="share-edit" data-id="${id}">${m==="never"||blockersOf(id).length?"Share anyway…":"Share with Christine…"}</button>`);
    if(m==="never") btns.push(`<button class="btn ghost" data-act="share-mode" data-v="auto" data-id="${id}">Back to automatic</button>`);
  }
  return `<h2>Christine</h2><div class="card sharebox">
    <p class="small muted" style="margin-top:0">${shareStatusLine(id,r)}${on&&custom?" She sees your edited version.":""}</p>
    ${on&&pub?`<div class="prose sharedprev">${pub.body?renderShared(pub.body):`<p class="muted">No notes.</p>`}</div>`:on?`<p class="small muted">Sending it over…</p>`:""}
    <div class="btnrow">${btns.join("")}</div></div>`;
}

/* ideas from Christine */
function ideasSorted(){ return Object.entries(S.ideas).sort((a,b)=>(b[1].created||"").localeCompare(a[1].created||"")); }
function newIdeaCount(){ return S.mode==="owner" ? Object.values(S.ideas).filter(i=>!i.hidden&&(i.state||"sent")==="sent").length : 0; }
function ideaText(t){ return `<p>${esc(t||"").replace(/\n/g,"<br>")}</p>`; }

  </div>`; }).join("")}</div>`;

function christineMoreHtml(){
  const ids=Object.keys(S.shared).sort((a,b)=>(S.shared[a].name||"").localeCompare(S.shared[b].name||""));

function gSorted(){ return Object.entries(S.shared).sort((a,b)=>(a[0]==="pip"?-1:b[0]==="pip"?1:0)||(KORD[a[1].kind]??99)-(KORD[b[1].kind]??99)||(a[1].kind==="beat"?(a[1].order||0)-(b[1].order||0):0)||(a[1].name||"").localeCompare(b[1].name||"")); }
function gSnip(t){ const s=String(t||"").replace(MENTION_RE,(m,id,l)=>l||S.shared[id]?.name||"[sealed]").replace(/\s+/g," ").trim(); return s.length>120?s.slice(0,120)+"…":s; }

async function sampleAllowed(){

async function maybeRunRequests(fromTap){
  if(S.mode!=="owner"||S.reqBusy||!S.reqLoaded||!S.sample) return;
  if(!reqPending().length){ if(S.reqNeedsTap){ S.reqNeedsTap=false; scheduleRender(); } return; }
  if(!shareReady()){ setTimeout(()=>maybeRunRequests(fromTap),1500); return; }
  if(!fromTap && !(await sampleAllowed())){ if(!S.reqNeedsTap){ S.reqNeedsTap=true; scheduleRender(); } return; }
  S.reqBusy=true; S.reqNeedsTap=false; scheduleRender();
  try{
    for(const [rid,q] of reqPending()){
      const doc=S.db.collection(REQ_COL).doc(rid);
      try{
        await doc.set({...q, state:"running", started:now()});
        let out={state:"done", answered:now()};
        if(q.kind==="check"){
          const v=await S.sample.json([{role:"user",content:checkPrompt(q,[q.prompt||""])}],{modelTier:"default",cache:false});
          out.verdict=cleanVerdicts(v,1)[0];
        } else {
          const g=await S.sample.json([{role:"user",content:genPrompt(q)}],{modelTier:"default",cache:false});
          const opts=(Array.isArray(g?.options)?g.options:[]).slice(0,4).map(o=>({title:String(o?.title||"Idea").slice(0,120), text:String(o?.text||"").slice(0,1500)})).filter(o=>o.text);
          if(opts.length){
            const v=await S.sample.json([{role:"user",content:checkPrompt(q,opts.map(o=>o.title+": "+o.text))}],{modelTier:"default",cache:false});
            const vs=cleanVerdicts(v,opts.length); opts.forEach((o,i)=>{ o.verdict=vs[i]; });
          }
          out.options=opts;
        }
        await doc.set({...q, ...out});
      }catch(e){
        const c=e?.code;
        if(c==="rate_limited"||c==="not_granted"){ await doc.set({...q, state:"queued"}).catch(()=>{}); if(c==="not_granted") S.reqNeedsTap=true; toast(c==="rate_limited"?"Claude’s busy. Christine’s requests will wait.":"Claude isn’t allowed here yet."); break; }
        await doc.set({...q, state:"failed", error:String(c||"error")}).catch(()=>{});
      }
    }
  } finally { S.reqBusy=false; scheduleRender(); }
}

/* ---------- gloss: Claude's own wording inside a record ---------- */
function cleanGloss(g,body){ body=String(body||""); return [...new Set((Array.isArray(g)?g:[]).map(x=>String(x||"").trim()).filter(x=>x.length>=8&&body.includes(x)))].slice(0,40); }
function liveGloss(r){ const b=String(r&&r.body||""); return ((r&&r.gloss)||[]).filter(g=>b.includes(g)); }
function glossMark(r){

}
function touchedByClaude(r){ return !!r && (r.source==="claude"||r.edited_by==="claude"); }
function needsWordingReview(r){ return touchedByClaude(r) && !r.vetted && !r.audited && !!String(r.body||"").trim() && !liveGloss(r).length; }
function wordingBox(id,r){

    ${gl.length>1?`<div class="btnrow"><button class="btn ghost" data-act="gloss-keepall" data-id="${id}">Keep all</button></div>`:""}</div>`;
  if(needsWordingReview(r)) return `<div class="card glossbox"><div class="small">Claude wrote or edited this text, and nobody has checked which sentences are yours.</div>
    <div class="btnrow">${S.sample?`<button class="btn" data-act="wording-audit" data-id="${id}">${S.auditing===id?"Checking…":"Find Claude’s additions"}</button>`:""}<button class="btn ghost" data-act="wording-ok" data-id="${id}">It’s all mine</button></div></div>`;

}
function mikesWords(){

/* ---------- claims, holds and what actually happened ---------- */
/* entries.claims: [{k, text, by:[entry ids or free text]}]. A faction's holds are worked out from
   every claim that names it. entries.truth: {state:"undecided"|"never"|"decided", text}, owner-only:
   never in briefs, never shared (pubDoc only sends the body). Older records may carry what_happened. */
const TRUTH_STATES=[["undecided","Undecided"],["never","Never decided"],["decided","Decided"]];
function claimsOf(r){ return Array.isArray(r&&r.claims)?r.claims.filter(c=>c&&String(c.text||"").trim()):[]; }
function claimBy(c){ return (Array.isArray(c&&c.by)?c.by:[]).filter(Boolean); }
function holderName(x){ const f=find(x); return f&&f.type!=="inbox"?titleOf(f.type,f.rec):x; }
function holderHtml(x){ const f=find(x); return f&&f.type!=="inbox"?mentionHtml(f.id):`<span class="holder">${esc(x)}</span>`; }
function holdsOf(fid){ const out=[]; for(const [rid,r] of Object.entries(S.entries)) for(const c of claimsOf(r)) if(claimBy(c).some(b=>b===fid||find(b)?.id===fid)) out.push({rid,r,c}); return out; }
function truthOf(r){
  if(!r) return null;
  if(r.truth&&typeof r.truth==="object") return {state:r.truth.state||"undecided",text:r.truth.text||""};
  if(typeof r.what_happened==="string"){ const w=r.what_happened.trim(); if(/^undecided$/i.test(w)) return {state:"undecided",text:""}; if(/^never( decided)?$/i.test(w)) return {state:"never",text:""}; return {state:w?"decided":"undecided",text:w}; }
  return null;
}
function claimsRecordHtml(id,f){
  if(f.type!=="entries") return ""; const r=f.rec; let h="";
  const cs=claimsOf(r);
  if(cs.length) h+=`<h2>Claims</h2><p class="small muted cl-sub">What people say, and who says it. None of it is confirmed.</p><div class="claims">${cs.map(c=>`<div class="claim"><div class="prose">${renderText(c.text)}</div>${claimBy(c).length?`<div class="small muted">Held by ${claimBy(c).map(holderHtml).join(", ")}</div>`:""}${claimBelieversHtml(id,c)}</div>`).join("")}</div>`;
  if(r.kind==="faction"){ const hs=holdsOf(id); if(hs.length) h+=`<h2>Holds</h2><p class="small muted cl-sub">What this lot believe, gathered from the claims that name them.</p><div class="claims">${hs.map(({rid,c})=>`<div class="claim"><div class="prose">${renderText(c.text)}</div><div class="small muted">On ${mentionHtml(rid)}</div></div>`).join("")}</div>`; }
  const t=truthOf(r);
  if(t||cs.length||r.kind==="event"){
    const tt=t||{state:"undecided",text:""};
    const lab=(TRUTH_STATES.find(x=>x[0]===tt.state)||TRUTH_STATES[0])[1];
    const note=tt.state==="never"?"On purpose: nobody ever gets to know, you included.":tt.state==="decided"&&!tt.text?"Decided, but not written down yet.":tt.state==="undecided"&&!tt.text?"Not decided yet.":"";
    h+=`<div class="card truth"><div class="small"><b>What actually happened</b> <span class="tag">${lab}</span> <span class="muted">· yours only: never in briefs or Christine’s view</span></div>${tt.text?`<div class="prose">${renderText(tt.text)}</div>`:""}${note?`<div class="small muted">${note}</div>`:""}</div>`;
  }
  return h;
}
function claimsEditorHtml(d){
  if(d.type!=="entries") return ""; const r=d.data;
  if(["place","joke"].includes(r.kind)&&!claimsOf(r).length&&!truthOf(r)) return "";
  const cs=Array.isArray(r.claims)?r.claims:[];
  let h=`<label class="f">Claims <span class="muted small">what people say, and who says it</span></label><div id="claimed">`;
  h+=cs.map((c,i)=>`<div class="claimed" data-k="${esc(c.k||"")}"><textarea rows="2" data-cf="text" placeholder="What they claim">${esc(c.text||"")}</textarea><input type="text" data-cf="by" value="${esc(claimBy(c).join(", "))}" placeholder="Held by: ids or names, commas between" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="btn ghost" data-act="cl-del" data-i="${i}">Remove claim</button></div>`).join("");
  h+=`</div><div class="btnrow"><button type="button" class="btn" data-act="cl-add">Add a claim</button></div>`;
  const t=truthOf(r)||{state:"undecided",text:""};

/* ---------- NPC hooks and minor NPCs ----------
   entries.hook (characters except Pip): {type, text, on, claim}. type is obsession | grudge | hobby |
   affiliation | belief. on is the faction or lore record it touches (an entry id). A wrong belief names
   the claim it believes: claim is the key of a claim on that record. entries.minor:true marks a minor
   NPC (folded in the Bible, a short editor); a character's place says where they stand.
   Owner-only: pubDoc only sends bodies, so hooks never reach Christine. */
const HOOK_TYPES=[["obsession","Obsession"],["grudge","Grudge"],["hobby","Hobby"],["affiliation","Faction or affiliation"],["belief","Wrong belief"]];
const HOOK_TYPE=Object.fromEntries(HOOK_TYPES);
function isNpc(id,r){ r=r||S.entries[id]; return !!r&&r.kind==="character"&&id!=="pip"; }
function hookOf(r){ const h=r&&r.hook; if(!h||typeof h!=="object"||!HOOK_TYPE[h.type]) return null; if(!String(h.text||"").trim()&&!h.claim&&!h.on) return null; return h; }
function hookClaim(h){ if(!h||h.type!=="belief"||!h.on||!h.claim) return null; const t=S.entries[h.on]; return t?claimsOf(t).find(c=>c.k===h.claim)||null:null; }
function hookProblem(h){
  if(!h) return "";
  if(h.on&&!find(h.on)) return `its hook points at ${h.on}, which doesn’t exist`;
  if(h.type==="belief"&&!h.on) return "its wrong belief doesn’t say which lore record it’s about";
  if(h.type==="belief"&&h.claim&&!hookClaim(h)) return "its wrong belief names a claim that’s no longer on "+(S.entries[h.on]?.name||h.on);
  return "";
}
function hookPlain(h){
  if(!h) return ""; const c=hookClaim(h), f=h.on&&find(h.on), on=f?titleOf(f.type,f.rec):h.on||"", tx=String(h.text||"").trim();
  if(h.type==="belief"&&c) return `Wrong belief about ${on}: “${String(c.text).trim()}”${tx?" ("+tx+")":""}`;
  return `${HOOK_TYPE[h.type]}${on?" ("+on+")":""}${tx?": "+tx:""}`;
}
function believersOf(rid,k){ return Object.entries(S.entries).filter(([id,e])=>{ const h=hookOf(e); return h&&h.type==="belief"&&h.on===rid&&(!k||h.claim===k); }).map(([id])=>id); }
/* does this NPC have a belief about that record: a wrong-belief hook on it, or named as holding one of its claims */
function npcBeliefOn(nid,rid){
  const h=hookOf(S.entries[nid]); if(h&&h.type==="belief"&&h.on===rid) return true;
  return claimsOf(S.entries[rid]).some(c=>claimBy(c).some(b=>b===nid||find(b)?.id===nid));
}
function contestedLore(rid){ const e=S.entries[rid]; return !!e&&claimsOf(e).length>0; }
function loreFigure(id,r){ return claimsOf(r).length>0||(r.tags||[]).includes("world-lore"); }
function npcLines(nid){ const out=[]; for(const [sid,sc] of Object.entries(S.scenes)) for(const l of sc.lines||[]) if(l.speaker===nid) out.push([sid,l]); return out; }
function hookRecordHtml(id,f){

}

function claimBelieversHtml(rid,c){ const b=believersOf(rid,c.k); return b.length?`<div class="small muted">Believed by ${b.map(x=>mentionHtml(x)).join(", ")}</div>`:""; }

/* runs inside saveDraft: tidy the hook and, for a new claim, add it to the lore record */
async function tidyHook(id,r){
  if(r.kind!=="character"){ delete r.hook; delete r.minor; return true; }
  const h=r.hook; if(!h||!HOOK_TYPE[h.type]){ delete r.hook; return true; }
  const o={type:h.type}; const tx=String(h.text||"").trim(); if(tx) o.text=tx;
  if(h.on){ const t=resolveHolder(h.on); o.on=find(t)?.type==="entries"?t:String(h.on).trim(); }
  if(o.type==="belief"&&o.on&&S.entries[o.on]){
    if(h.claim==="__new"){
      const txt=String(h.newClaim||"").trim();
      if(txt){ const t=S.entries[o.on], k=lineKey(); const nt={...t,claims:[...claimsOf(t),{k,text:txt,by:[]}],updated:now()};
        if(!(await put("entries",o.on,nt))) return false; o.claim=k; }
    } else if(h.claim&&claimsOf(S.entries[o.on]).some(c=>c.k===h.claim)) o.claim=h.claim;
  }
  if(!o.text&&!o.on&&!o.claim){ delete r.hook; return true; }
  r.hook=o; return true;
}

/* the health check's three hook sections */
function hookHealth(add){
  const lore=[], dang=[], none=[];
  for(const [nid,e] of Object.entries(S.entries)){
    if(!isNpc(nid,e)) continue;
    const h=hookOf(e), lines=npcLines(nid);
    const prob=hookProblem(h); if(prob) dang.push({id:nid,note:prob});
    if(!h&&lines.length) none.push({id:nid,note:`speaks ${lines.length} line${lines.length===1?"":"s"}`});
    if(loreFigure(nid,e)) continue;
    const said=new Map();
    for(const [sid,l] of lines) for(const m of String(l.text||"").matchAll(MENTION_RE)) if(!said.has(m[1])) said.set(m[1],"in "+(S.scenes[sid]?.title||sid));
    for(const m of String(e.body||"").matchAll(MENTION_RE)) if(!said.has(m[1])) said.set(m[1],"in their record");
    for(const [rid,where] of said){ const f=find(rid); const tid=f?.id; if(!tid||tid===nid||!contestedLore(tid)) continue; if(npcBeliefOn(nid,tid)) continue;
      lore.push({id:nid,note:`mentions ${S.entries[tid].name} (${where}), which is contested, with no belief about it. Give them a wrong belief, or name them in one of its claims.`}); }
  }
  add("hook_lore","NPCs talking about contested lore with no belief","Lore is contradicted on purpose, so this only flags an NPC who mentions a record with claims but has no wrong belief about it: no hook naming one of its claims, and not named in a claim’s Held by.",lore);
  add("hook_dangling","Hooks pointing at something that’s gone","The record or claim a hook names has been removed or renamed.",dang);
  add("hook_none","NPCs speaking with no hook","Every NPC gets one specific hook before any dialogue is written.",none);
}

  const roleItem=(role,label)=>{ const x=beats.filter(([,b])=>b.role===role); const ok=x.some(([,b])=>solid(b));

  const mid=beats.filter(([,b])=>!b.role&&solid(b)).length;

    roleItem("climax","Climax beat"), roleItem("ending","Ending beat"),

}

function interviewTask(gid,start){
  const gname=gameName(gid);

  if(gid==="series"||!S.games[gid]){
    const open=Object.entries(S.loose).filter(([,l])=>l.open!==false&&(l.game==="series")&&!isParked(l)).map(([id])=>id);
    return `TASK: Interview Mike about the series as a whole. This is a SHORT interview with a hard budget: at most 6 questions, then stop.${start?"\nHe wants to start with: "+start:""}

Only ask about series-level things that the next game to be written (${gameName(nextGame())||"none"}) actually depends on, or open series loose ends that are not parked: ${open.join(", ")||"(none)"}. Never ask about detail for games further off; if Mike says something can wait, use park_loose_end and move on.

Rules: ${oneQ} Offer 2 or 3 options only when he asks or is stuck: options are your wording, not his. ${OPT_FORMAT} After each answer: one or two sentences on what it opens up or strains in canon, file any decision he has clearly stated with add_to_inbox (in his words), close or park loose ends his answer settles, then ask the next question. Start each reply with "Question N of 6".
STOP RULE: after 6 questions, or sooner if nothing unparked is left, give a short numbered recap of what he decided and what is still open, and ask nothing further.`;
  }
  const rd=readiness(gid); const gaps=rd.items.filter(i=>!i.done&&!i.parked);
  const parked=Object.entries(S.loose).filter(([,l])=>l.open!==false&&isParked(l,gid)).map(([id])=>id);
  const list=rd.items.map((it,i)=>`${i+1}. [${it.done?"done":it.parked?"PARKED BY MIKE":"GAP"}] ${it.label}${it.detail?": "+it.detail:""}`).join("\n");
  if(!gaps.length) return `TASK: Mike started an interview for ${gname} (game id ${gid}), but every item on its READY-TO-WRITE checklist is done or parked by him:\n${list}\n\nSay so in two lines, suggest "Tell it back" as the next step, and ask nothing.`;
  return `TASK: Interview Mike to get ${gname} (game id ${gid}) ready to write. This interview has a finish line: the READY-TO-WRITE checklist below. Your only job is to close its gaps.${start?"\nHe wants to start with: "+start+" (begin with the gap closest to that)":""}

READY-TO-WRITE for ${gname} (${rd.done} of ${rd.total} done):
${list}

PARKED loose ends (a later game settles them; off-limits unless Mike raises them): ${parked.join(", ")||"(none)"}

Items marked PARKED BY MIKE are open on purpose: he is finding them as he writes. They are not gaps. Never ask about them, never offer answers for them, and don't count them against the game being ready.

Rules:
- Work through the GAPs in the order listed; ${oneQ}
- Start every reply with one line of progress, e.g. "Gap 2 of ${gaps.length}: What Pip wants".
- Never ask about anything that isn't needed to close a gap: nothing about later games, parked loose ends, backstory, or detail this game can ship without. If Mike wanders there, note it with add_to_inbox in his words and steer back.
- For a spine line (logline, want, threat, joy, ending image, hand-off), ask him openly first. Offer a) b) c) options only if he asks or is stuck, because options are your wording, not his. ${OPT_FORMAT}
- After each answer: one sentence on what it opens up or strains in canon, then record it. Spine lines: set_spine, in his words (if he picked one of your options, that option's text). A beat he describes and asks you to file: file_record with role set when it is the opening, climax, ending or stinger. An existing beat he says is the opening, climax or ending: update_record with role. A loose end his answer settles: close_loose_end. One he says can wait: park_loose_end.
- The "Middle" gap is closed by beats, not by questions about lore: ask what happens next after the last solid beat, one beat at a time. If he has no idea, tell him to use Brainstorm for that stretch rather than inventing it for him.
- The "Nothing open that this game needs" gap: take the listed loose ends one at a time; each ends closed, or parked for a later game.
- STOP RULE: when every gap is closed, or after 8 questions, whichever comes first, stop asking. Give a short numbered recap: what he decided, which gaps remain, and say plainly either "${gname} is ready to write" or what still stands between it and ready. Ask nothing after the recap.`;
}
function gapParkedRule(gid){
  const P=(S.games[gid]?.gap_parked||[]).map(x=>String(x.q||"").trim()).filter(Boolean);
  return P.length?`\n- Mike is finding these out as he writes, on purpose. Don't raise them as gaps or list them as problems; where the story reaches one, write [PARKED: a label of two to five words] and carry on:\n${P.map(q=>"  - "+q).join("\n")}`:"";
}
function tellbackTask(gid){
  const gname=gameName(gid);
  return `TASK: Tell ${gid==="series"?"the series so far":gname} back to Mike as a player would experience it, start to finish, so he can hear whether it holds together.

Rules:
- Use ONLY what the bible holds. Canon is fact. Maybe records may be used but say "(maybe)" after each. Ignore brainstorms, the inbox, pitches, and anything marked claude_wording_unapproved.
- Follow the beats in their bible order${gid==="series"?", game by game":""}. If the order itself makes no sense (an opening after a climax), tell it in the order given and flag it.
- Do NOT smooth over holes. Wherever you would have to invent a link, a reason or an event to keep the story moving, stop and write a gap marker instead: [GAP @record_id: the question]. record_id is the record Mike's answer belongs on: usually the beat where the hole bites, otherwise the character, place or item entry; leave "@record_id" out if nothing fits. Phrase it as a question Mike can answer in a sentence or two. If one hole raises several separate questions, put them in the same marker separated by " | ". No [[links]] inside a marker: use names. Never fill a gap yourself.
- Lines in a record's notes that start "Mike’s answer:" are Mike's own decisions, given in answer to an earlier telling. Treat them as fact even on brainstorm or maybe records, without "(maybe)".${gapParkedRule(gid)}
- Plain storytelling, present tense, no more than about 250 words for the telling.
- Then a numbered list, most serious first: (1) gaps where the player would not understand why something happens or why Pip does it; (2) setups with no payoff and payoffs with no setup inside this game; (3) promises earlier games made to the player that this game ignores; (4) where the spine (logline, want, threat, joy, ending, hand-off) is missing or the beats don't deliver it.
- Finish with one line: the single most useful thing to settle next. Don't use tools unless Mike asks.`;
}

     inputSchema:{type:"object",properties:{game:{type:"string",description:"Game id, e.g. pip_2 (not series)"},field:{type:"string",enum:SPINE_FIELDS.map(x=>x[0])},text:{type:"string"}},required:["game","field","text"]},
     execute: async (inp)=>{
       const gid=String(inp.game||""); const g=S.games[gid]; if(!g||gid==="series") throw new Error("no game with id "+gid);
       const F=SPINE_FIELDS.find(x=>x[0]===inp.field); if(!F) throw new Error("field must be one of "+SPINE_FIELDS.map(x=>x[0]).join(", "));
       const text=String(inp.text||"").trim().slice(0,600); if(!text) throw new Error("text required");
       const after={...g,spine:{...(g.spine||{}),[F[0]]:text},spine_by:{...(g.spine_by||{}),[F[0]]:"claude"}};
       const cid=await commit([{type:"games",id:gid,before:clone(g),after}],"Spine: "+F[1]+" for "+g.name);
       pushNote({id:"",label:"Spine noted for "+g.name+": "+F[1],change:cid}); return {ok:true};
     }},
    {name:"park_loose_end", description:"Set which game has to settle an open loose end, when Mike says it can wait or says which game it belongs to. needed_by is a game id, or 'later' when no game is chosen. Parked loose ends are left alone by the interview until that game. Undoable.",
     inputSchema:{type:"object",properties:{id:{type:"string"},needed_by:{type:"string",description:"Game id, or 'later'"}},required:["id","needed_by"]},
     execute: async (inp)=>{
       const id=String(inp.id||"").trim(); const l=S.loose[id]; if(!l) throw new Error("no loose end with id "+id);
       const nb=String(inp.needed_by||"").trim(); if(nb!=="later"&&(!S.games[nb]||nb==="series")) throw new Error("needed_by must be a game id or 'later'");
       const cid=await commit([{type:"loose",id,before:clone(l),after:{...l,needed_by:nb,updated:now()}}],"Needed by "+needLabel(nb)+": "+l.title);
       pushNote({id,label:(isParked({needed_by:nb})?"Parked until ":"Needed by ")+needLabel(nb)+": "+l.title,change:cid}); return {ok:true,parked:isParked({needed_by:nb})};
     }}
  ];
}

/* ---------- health: deterministic checks, no model involved ---------- */
function healthIssues(){
  const out=[]; const add=(key,title,why,items,opt)=>{ if(items.length) out.push({key,title,why,items,...(opt||{})}); };
  const recs=[]; for(const t of ["entries","beats","scenes","loose"]) for(const [id,r] of Object.entries(S[t])) recs.push([t,id,r]);
  /* beat order */
  const ord=[];
  for(const [id,b] of Object.entries(S.beats)){
    for(const w of beatWarnings(id,b)) ord.push({id,note:w});
    for(const t of b.leads_to||[]){ const tb=S.beats[t]; if(tb&&tb.game===b.game&&(tb.order??0)<(b.order??0)) ord.push({id,note:`leads to “${tb.title}”, which comes earlier`}); }
  }
  for(const [gid] of gamesSorted()){
    const bs=beatsOf(gid); if(!bs.length) continue; const idx=r=>bs.findIndex(([,b])=>b.role===r);
    const o=idx("opening"), c=idx("climax"), e=idx("ending");
    if(o>0) ord.push({id:bs[o][0],note:`marked as the opening, but ${o} beat${o>1?"s come":" comes"} before it`});
    if(e>=0&&c>e) ord.push({id:bs[c][0],note:"the climax is placed after the ending"});
    if(e>=0){ const after=bs.slice(e+1).filter(([,b])=>b.role!=="stinger").length; if(after) ord.push({id:bs[e][0],note:`marked as the ending, but ${after} beat${after>1?"s":""} come${after>1?"":"s"} after it`}); }
  }
  add("order","Beats out of order","A beat needs something that happens later, or the opening, climax and ending aren’t where their names say. Reorder them on the Beats tab.",ord);
  /* dead links */
  add("dead","Links to records that don’t exist","Tap through and either create the record or fix the link.",[...missingMentions()].map(([mid,from])=>({id:from[0],note:`links to ${mid}, which doesn’t exist`+(from.length>1?` (so do ${from.length-1} more)`:"")})));
  /* waiting on Mike's thumb */
  add("thumb","Waiting for your tap","Claude can’t set or change canon. These are its proposals.",recs.filter(([, ,r])=>(r.propose_canon&&r.status!=="canon")||r.pending).map(([,id,r])=>({id,note:r.pending?"proposed edit to canon":"put forward as canon"})));
  /* loose ends something claims to settle */
  const ans=[];
  for(const [id,l] of Object.entries(S.loose)){
    if(l.open===false) continue;
    const re=new RegExp("(closes|closed|settles|settled|answers|answered|pays off|paid off|resolves|resolved|retires)[^\\[\\n]{0,40}\\[\\["+id+"(?=[\\]|])","i");
    const by=recs.find(([,rid,r])=>rid!==id&&re.test(bodyText(r)+" "+(r.resolution||"")));
    if(by) ans.push({id,note:`“${titleOf(by[0],by[2])}” (${by[2].status||"brainstorm"}) says it settles this`});
  }
  add("answered","Open loose ends that something claims to settle","Another record says it answers these. If it does and you agree, close them; if the answer is only a brainstorm, decide.",ans);
  /* inbox */
  const hay=normT(recs.map(([, ,r])=>bodyText(r)+" "+(r.resolution||"")+" "+(r.later||"")).join(" | "));
  const inbox=Object.entries(S.inbox).sort((a,b)=>(b[1].created||"").localeCompare(a[1].created||""));
  const seen=new Map(), dup=[], filed=[];
  for(const [id,i] of inbox){
    const n=normT(i.text); if(!n) continue;
    if(seen.has(n)){ dup.push({inbox:id,note:"same text as a newer note"}); continue; } seen.set(n,id);
    const quotes=[...String(i.text||"").matchAll(/["“]([^"”]{16,})["”]/g)].map(m=>normT(m[1])).filter(q=>q.length>=16);
    if(quotes.some(q=>hay.includes(q))||(n.length>=30&&hay.includes(n))) filed.push({inbox:id,note:"its wording is already in a record"});
  }
  add("inbox_dup","Inbox notes that repeat each other","Exact duplicates of a newer note.",dup,{fix:"hl-clear-inbox",fixLabel:"Clear these duplicates"});
  add("inbox_filed","Inbox notes that look already filed","A quoted line from each of these already sits in a bible record, so the note has probably done its job. Check the list before clearing; clearing can be undone from the inbox.",filed,{fix:"hl-clear-inbox",fixLabel:"Clear these from the inbox"});
  /* needed by */
  add("need","Open loose ends with no “needed by” game","Until each has one, nothing can be parked and the interview can’t tell what can wait.",Object.entries(S.loose).filter(([,l])=>l.open!==false&&!l.needed_by).sort((a,b)=>(a[1].title||"").localeCompare(b[1].title||"")).map(([id,l])=>({id,need:true})));
  /* wording */
  add("gloss","Claude’s wording waiting for a keep or cut","Sentences Claude added that you haven’t approved.",recs.filter(([, ,r])=>liveGloss(r).length).map(([,id,r])=>({id,note:liveGloss(r).length+" highlighted"})));
  add("unvetted","Canon text Claude wrote that nobody has checked","These records are canon, but Claude wrote or edited the wording. Open one and tap Find Claude’s additions, or It’s all mine.",recs.filter(([, ,r])=>r.status==="canon"&&needsWordingReview(r)).map(([,id])=>({id})));
  add("shipped","Shipped records Claude has edited","These describe a released game, and Claude changed their text before the shipped lock existed. Check the text still says what shipped; move anything added later into Later reading.",recs.filter(([,id,r])=>isShipped(id,r)&&r.edited_by==="claude"&&!r.vetted).map(([,id])=>({id})));
  /* reveal leaks */
  const leaks=[]; for(const [t,id,r] of recs) for(const x of revealLeaks(t,r)) leaks.push({id,note:x});
  add("leak","Secrets mentioned too early","A beat or scene mentions something sealed until a later game.",leaks);
  /* long ids */
  add("ids","Ids that are a mouthful","These become permanent names in the game code. Rename from the record page; the old id keeps working.",recs.filter(([,id])=>id.length>40).map(([,id])=>({id,note:id.length+" characters"})));
  /* jokes kept twice */
  const lore=Object.entries(S.entries).filter(([,e])=>e.kind==="lore"&&e.status==="canon").map(([id,e])=>[id,normT(e.body)]);
  const jd=[]; for(const [id,e] of Object.entries(S.entries)){ if(e.kind!=="joke") continue; const n=normT(e.name); if(n.length<6) continue; const hit=lore.find(([,b])=>b.includes(n)); if(hit) jd.push({id,note:`also described in “${S.entries[hit[0]].name}”`}); }
  hookHealth(add);
  add("jokes","In-jokes recorded in two places","The joke entry and a lore entry both describe it. When they drift apart, Claude can’t tell which is right: keep the rule in one and link to it from the other.",jd);
  return out;
}

/* ---------- id rename with alias ---------- */
async function renameRecord(oldId,newId){
  const f=find(oldId); if(!f||f.id!==oldId||!["entries","beats","scenes","loose"].includes(f.type)) return false;
  const type=f.type;
  const mention=new RegExp("\\[\\["+oldId+"(?=[\\]|])","g");
  const fixs=s=>typeof s==="string"?s.replace(mention,"[["+newId):s;
  const fixa=ids=>Array.isArray(ids)?[...new Set(ids.map(x=>x===oldId?newId:x))]:ids;
  const fixRec=rec=>{ const n=clone(rec);
    for(const k of ["body","resolution","disguise","later","text","canon_note"]) if(n[k]) n[k]=fixs(n[k]);
    for(const k of ["beat","place","within","after","keptId"]) if(n[k]===oldId) n[k]=newId;
    for(const k of ["requires","leads_to","links"]) if(n[k]) n[k]=fixa(n[k]);
    if(Array.isArray(n.lines)) n.lines=n.lines.map(l=>({...l,speaker:l.speaker===oldId?newId:l.speaker,text:fixs(l.text)}));
    if(Array.isArray(n.gloss)) n.gloss=n.gloss.map(fixs);
    if(n.pending&&n.pending.after) n.pending={...n.pending,after:fixRec(n.pending.after)};
    return n; };
  const ops=[];
  for(const t of ["entries","beats","scenes","loose","inbox","pitches"]) for(const [oid,rec] of Object.entries(S[t])){
    if(oid===oldId&&t===type) continue;
    const nxt=fixRec(rec); if(JSON.stringify(nxt)!==JSON.stringify(rec)) ops.push({type:t,id:oid,before:clone(rec),after:nxt});
  }
  const self=fixRec(f.rec); self.updated=now();
  ops.push({type,id:newId,before:null,after:self},{type,id:oldId,before:clone(f.rec),after:null});
  for(const [aid,al] of Object.entries(S.aliases)) if(al.to===oldId&&aid!==newId) ops.push({type:"aliases",id:aid,before:clone(al),after:{...al,to:newId}});
  if(S.aliases[newId]) ops.push({type:"aliases",id:newId,before:clone(S.aliases[newId]),after:null});
  ops.push({type:"aliases",id:oldId,before:null,after:{to:newId,at:now()}});
  try{ await commit(ops,"Renamed id "+oldId+" → "+newId+" ("+(ops.length-3)+" links rewritten)"); }catch(e){ toast("The rename stopped part-way. Undo it from the inbox change list."); return false; }
  try{ const ov=S.shareOv&&S.shareOv[oldId]; if(ov){ await S.db.collection(OV_COL).doc(newId).set(ov); await S.db.collection(OV_COL).doc(oldId).delete(); } }catch(e){}
  if(S.unlocked.has(oldId)){ S.unlocked.delete(oldId); S.unlocked.add(newId); }
  return true;
}

const BOX_MAX=140;
function spHue(sp){ let h=7; for(const c of String(sp)) h=(h*31+c.charCodeAt(0))%360; return h; }
function spStyle(sp){ return sp?` style="--h:${spHue(sp)}"`:""; }
function lineSpans(t){
  return esc(t||"").replace(MENTION_RE,(m,id,label)=>{ const f=find(id); return `<span class="ment">${label||esc(f&&f.type!=="inbox"?titleOf(f.type,f.rec):id)}</span>`; }).replace(/\n/g,"<br>");

function scKey(l,i){ return l.k||("i"+i); }
function scIdx(lines,k){ return k==null?-1:lines.findIndex((l,i)=>scKey(l,i)===k); }
function scLocked(id,r){ return (r.status||"")==="canon"&&!S.unlocked.has(id); }
function sceneGame(r){ return r.game||(S.beats[r.beat]&&S.beats[r.beat].game)||""; }
function sceneCast(r){ const out=[]; for(const l of r.lines||[]) if(l.speaker&&!out.includes(l.speaker)) out.push(l.speaker); return out; }

function scDefaultSpeaker(lines){ if(!lines.length) return S.entries.pip?"pip":""; return scNextSpeaker(lines,lines[lines.length-1].speaker||""); }
function scState(id){
  if(!S.sc||S.sc.id!==id) S.sc={id,edit:null,editSp:"",insAfter:null,speaker:null,armed:null};
  if(S.sc.speaker===null){ const r=S.scenes[id]; const lines=(r&&r.lines)||[]; const at=scIdx(lines,S.sc.insAfter); S.sc.speaker=scDefaultSpeaker(at>=0?lines.slice(0,at+1):lines); }

function scParsePrefix(t){

async function scSave(id,lines){

/* ---------- tell it back: answer the gaps where they sit ---------- */
/* Claude writes [GAP @record_id: question | question] (older answers: [GAP: …]) and [PARKED: label]. */
function gapScan(text){
  const out=[]; const s=String(text||""); let i=0;
  while(i<s.length){
    const at=s.indexOf("[",i); if(at<0) break;
    const head=s.slice(at,at+8).toUpperCase();
    if(!head.startsWith("[GAP")&&!head.startsWith("[PARKED")){ i=at+1; continue; }
    let d=0, j=at; for(;j<s.length;j++){ if(s[j]==="[") d++; else if(s[j]==="]"){ d--; if(d===0) break; } }
    if(j>=s.length) break;
    const inner=s.slice(at+1,j), m=inner.match(/^(GAP|PARKED)\s*(?:@([a-z0-9_]+))?\s*:?\s*([\s\S]*)$/i);
    if(m) out.push({start:at,end:j+1,kind:m[1].toUpperCase(),target:m[2]||"",body:m[3].replace(MENTION_RE,(x,id,label)=>label||titleOf(find(id)?.type,find(id)?.rec)||id).trim()});
    i=j+1;
  }
  return out;
}
function gapPoints(g){
  let parts=g.body.includes("|")?g.body.split("|"):g.body.split(/(?<=\?)\s+(?=\S)|;\s+/);
  parts=parts.map(x=>x.trim()).filter(Boolean);
  return parts.length?parts:[g.body||"Something’s missing here."];
}
function gapGame(){ const a=S.ask; return (a.scope&&a.scope.game)||(S.games[a.game]?a.game:"")||writeGame(); }
function gapTargets(sel){
  const gid=gapGame(); let h=`<option value="">Inbox (sort it later)</option>`;
  const bs=gid&&gid!=="series"?beatsOf(gid):[];
  const f=sel?find(sel):null;
  if(f&&f.type!=="inbox"&&!(f.type==="beats"&&bs.some(([b])=>b===sel))) h+=`<option value="${esc(sel)}" selected>${esc(TYPE_LABEL[f.type]+": "+titleOf(f.type,f.rec))}</option>`;
  if(bs.length) h+=`<optgroup label="Beats in ${esc(gameName(gid))}">${bs.map(([b,r])=>`<option value="${esc(b)}" ${b===sel?"selected":""}>${esc(String(r.title||b).slice(0,60))}</option>`).join("")}</optgroup>`;
  if(gid&&S.games[gid]&&gid!=="series") h+=`<option value="@game">${esc(gameName(gid))}: the game’s own notes</option>`;
  return h;
}
function gapCardHtml(t,ti,gi,g){
  if(g.kind==="PARKED") return `<span class="gapchip">⏸ ${esc(g.body)}: finding it as you go</span>`;
  const pts=gapPoints(g), G=t.gaps||{};

    const k=gi+"."+pi, st=G[k], base=`data-t="${ti}" data-g="${gi}" data-p="${pi}"`;
    if(st&&st.state==="done"){ const tf=st.target&&find(st.target); return `<span class="gapq done"><span class="gapt">${esc(p)}</span><span class="gapans">✓ ${esc(st.answer)}<span class="gapwhere"> · ${st.target==="@game"?"on "+esc(gameName(st.game)):tf?`on <a href="#r-${toHash(st.target)}">${esc(titleOf(tf.type,tf.rec))}</a>`:"in the inbox"}</span></span></span>`; }
    if(st&&st.state==="parked") return `<span class="gapq parked"><span class="gapt">${esc(p)}</span><span class="gapans">⏸ Finding it as you go <button type="button" class="sclink" data-act="gap-undo" ${base}>Undo</button></span></span>`;
    if(st&&st.state==="skip") return `<span class="gapq skipped"><span class="gapt">${esc(p)}</span><span class="gapans">Skipped <button type="button" class="sclink" data-act="gap-undo" ${base}>Undo</button></span></span>`;
    return `<span class="gapq"><span class="gapt">${esc(p)}</span>
      <textarea id="gap-${ti}-${gi}-${pi}" rows="2" placeholder="Your answer…" aria-label="Your answer"></textarea>
      <span class="gaprow"><span class="small muted">Goes on</span><select class="field gaptarget" id="gapto-${ti}-${gi}-${pi}" aria-label="Where the answer goes">${gapTargets(g.target)}</select></span>
      <span class="gapbtns"><button type="button" class="btn primary" data-act="gap-save" ${base}>Save</button><button type="button" class="btn" data-act="gap-park" ${base}>Finding it as I go</button><button type="button" class="btn ghost" data-act="gap-skip" ${base}>Skip</button></span></span>`;
  }).join("");

/* render one turn's answer with live gap cards */
function gapRender(t,ti,pick,loose){
  const gs=gapScan(t.a); if(!gs.length) return renderText(t.a,true,pick,loose);
  let s="", at=0; gs.forEach((g,n)=>{ s+=t.a.slice(at,g.start)+"\u0001"+n+"\u0001"; at=g.end; }); s+=t.a.slice(at);

function gapAnswerText(q,ans){ return `Mike’s answer: ${ans} (to the gap “${q}”)`; }

/* ---------- roleplay: Mike plays one character, Claude plays the rest of the scene ---------- */
const RP_COL="roleplays";
function plSess(id){ return (S.rp||{})[id]||null; }
function plState(id){
  if(!S.pl||S.pl.id!==id) S.pl={id,setup:null,sp:null,edit:null,armed:null,drop:false,dropAt:null,showCtx:false};
  return S.pl;
}
function plRunning(id){ return !!(S.plRun&&S.plRun.id===id&&S.plRun.busy); }
function plChars(){ return Object.entries(S.entries).filter(([,e])=>e.kind==="character"); }
function isChar(id){ return S.entries[id]?.kind==="character"; }
/* who's likely in this scene: its speakers, plus characters the scene or its beat mention */
function plSuggest(r){
  const out=sceneCast(r).filter(isChar);
  const add=x=>{ if(isChar(x)&&!out.includes(x)) out.push(x); };
  const b=S.beats[r.beat];
  for(const src of [r,b].filter(Boolean)){ for(const m of bodyText(src).matchAll(MENTION_RE)) add(m[1]); for(const x of [...(src.requires||[]),...(src.links||[])]) add(x); }
  return out;
}
function plSetup(id,r){
  const st=plState(id); if(st.setup) return st.setup;
  const prev=st.lastSetup||null, sug=plSuggest(r);
  const you=prev?.you&&isChar(prev.you)?prev.you:(S.entries.pip?"pip":(sug[0]||""));
  const them=(prev?.them||sug).filter(x=>x!==you&&isChar(x));
  const lines=rdLines(r);
  st.setup={you,them,after:lines.length?scKey(lines[lines.length-1],(r.lines||[]).indexOf(lines[lines.length-1])):"",note:prev?.note||""};
  return st.setup;

/* the scene lines this take follows on from: everything up to `after`, minus lines this take already dropped in */
function plCtx(r,sess){
  const all=(r.lines||[]).map((l,i)=>({...l,k:scKey(l,i)})).filter(l=>String(l.text||"").trim());
  const mine=new Set((sess.lines||[]).map(l=>l.into).filter(Boolean));
  let upto=all.length;
  if(sess.after===""){ upto=0; } else if(sess.after){ const i=all.findIndex(l=>l.k===sess.after); if(i>=0) upto=i+1; }
  return all.slice(0,upto).filter(l=>!mine.has(l.k));
}
function plKeptOpen(sess){ return (sess?.lines||[]).filter(l=>l.keep&&!l.dropped&&l.by!=="dir"); }
function plWho(sess){
  return `You: <b${spStyle(sess.you)}>${esc(speakerName(sess.you))}</b> · Claude: ${(sess.them||[]).map(x=>`<b${spStyle(x)}>${esc(speakerName(x))}</b>`).join(", ")||"nobody"} + narration`;
}

/* ---- prompt ---- */
function plSnip(t,n){ t=String(t||"").replace(/\s+/g," ").trim(); return t.length>n?t.slice(0,n-1)+"…":t; }
function plLineText(l){
  if(l.by==="dir") return `[Mike's direction to you: ${l.text}]`;
  return (l.speaker?speakerName(l.speaker).toUpperCase()+" ("+l.speaker+")":"N")+": "+l.text;
}
function plPrompt(id,sess,mode,prevTake){
  const r=S.scenes[id], them=(sess.them||[]).filter(x=>S.entries[x]), you=sess.you, yn=speakerName(you);
  const P=[];
  P.push(`You are improvising a scene with Mike, who is writing his game (a Zelda-style adventure). This is a rehearsal, not canon: Mike will keep the lines he likes.`);
  P.push(`Mike plays ${yn} (id ${you}). You play everyone else in the scene: ${them.map(x=>speakerName(x)+" (id "+x+")").join(", ")}. You may also write short narration.`);
  const S2=[`Scene: "${r.title||id}" in ${gameName(sceneGame(r))}.`];
  if(r.body) S2.push("Scene notes: "+String(r.body).trim());
  if(r.beat&&S.beats[r.beat]) S2.push("THE BEAT this scene belongs to:\n"+recordDump(r.beat));
  const pl=r.place||S.beats[r.beat]?.place;
  if(pl&&S.entries[pl]) S2.push("THE PLACE:\n"+plSnip(recordDump(pl),900));

    for(const o of [...hm,...[...bodyText(e).matchAll(MENTION_RE)].map(m=>m[1])]){ if(cast.has(o)||seen.has(o)||!S.entries[o]) continue; seen.add(o); const oe=S.entries[o]; extra.push(`- ${oe.name} (${oe.kind}, ${oe.status||"brainstorm"}): ${plSnip(oe.body,220)}`); if(extra.length>=8) break; }

  if(S.entries[you]) P.push(`WHO THEY'RE TALKING TO. Background for you as the writer, not knowledge your characters have. They only know about ${yn} what they can see, what their own records say, and what's been said in this scene:\n`+plSnip(recordDump(you),1500));
  const ctx=plCtx(r,sess);
  P.push("THE SCENE SO FAR (already in the script):\n"+(ctx.length?ctx.map(l=>(l.speaker?speakerName(l.speaker).toUpperCase()+" ("+l.speaker+")":"N")+": "+l.text).join("\n"):"(nothing yet: the scene starts here)"));

  P.push("THE IMPROV SO FAR:\n"+(imp.length?imp.map(plLineText).join("\n"):"(nothing yet)"));
  P.push(`RULES
- Speak only as your characters, or as narration. Never write a line, an action, a feeling or a thought for ${yn}: Mike does that.
- One line is one game text box: at most 140 characters, and shorter is better. Spoken game dialogue, not prose.
- Usually 1 to 3 lines per turn, then stop where ${yn} would naturally answer or act.
- Keep each character in the voice their record gives them. If it gives none, keep them plain and consistent.
- A character knows only what their record, the beat and the place give them, plus what has been said or shown in this scene. Asked about anything else, they react the way that character would: dodge it, guess wrong, admit they don't know, change the subject. Don't let them spill a secret from their record unless the scene has earned it.
- Don't settle open questions or invent big lore. Small colour (a gesture, a smell, a habit) is fine. Don't bring in named characters who aren't listed.
- Mike's directions in square brackets are for you, not dialogue: follow them from your next line.
- Narration (N:) is for actions and sounds only: short, present tense, never what ${yn} does or feels.`);
  let task;

Nothing else: no preamble, no notes, no quotation marks.

${task}`);
  return P.join("\n\n");
}
function plParse(text,sess){
  const out=[], them=sess.them||[], you=sess.you;
  const byName=k=>{ k=k.toLowerCase().replace(/\s*\(.*\)\s*$/,"").trim(); if(["n","narration","narrator","narr"].includes(k)) return ""; const idk=k.replace(/\s+/g,"_");
    if(S.entries[idk]&&isChar(idk)) return idk;
    const hit=plChars().find(([,e])=>(e.name||"").toLowerCase()===k)||plChars().find(([,e])=>(e.name||"").toLowerCase().split(/\s+/)[0]===k);
    return hit?hit[0]:null; };
  for(let raw of String(text||"").split(/\n+/)){
    raw=raw.trim(); if(!raw) continue;
    const m=raw.match(/^\**([A-Za-z0-9_ .'’-]{1,40}?(?:\s*\([^)]{1,40}\))?)\**\s*:\s*(.*)$/);
    let sp=m?byName(m[1]):null, t=m&&sp!==null?m[2]:raw;
    t=t.replace(/^\*+|\*+$/g,"").trim().replace(/^["“](.*)["”]$/,"$1").trim();
    if(sp===you) continue; // never keep a line Claude wrote for Mike's character
    if(sp===null){ if(out.length){ out[out.length-1].text+=" "+t; continue; } sp=""; }
    if(t) out.push({speaker:sp,text:t});
  }
  return out;
}
function plNextMode(sess){ const ls=sess?.lines||[], l=ls[ls.length-1]; return l&&(l.by==="mike"||l.by==="dir")?"turn":"goon"; }
function plModel(){
  const M=S.model||{}, o={cache:false};
  if(["quick","default","complex"].includes(M.pick)) o.modelTier=M.pick;
  else if(M.pick&&M.pick!=="auto"){ o.model=M.pick; o.modelTier="default"; }
  else o.modelTier="default";
  if(["low","medium","high"].includes(M.effort)) o.effort=M.effort;
  return o;
}

/* ---- data ---- */
async function plSave(id,doc){
  if(!S.db){ toast("Story data isn’t available here."); return false; }
  doc={...doc,updated:now()}; S.rp=S.rp||{}; const prev=S.rp[id]; S.rp[id]=doc;
  try{ await S.db.collection(RP_COL).doc(id).set(doc); return true; }
  catch(e){ if(S.rp[id]===doc){ if(prev) S.rp[id]=prev; else delete S.rp[id]; } writeErr(e); return false; }
}
async function plDiscard(id){
  if(!S.db) return false; const prev=S.rp[id]; delete S.rp[id];
  try{ await S.db.collection(RP_COL).doc(id).delete(); return true; } catch(e){ if(prev) S.rp[id]=prev; writeErr(e); return false; }
}
async function plRun(id,mode){
  if(!S.sample){ toast("Asking Claude isn’t available in this view."); return; }
  if(plRunning(id)) return;
  let sess=plSess(id); if(!sess) return;
  let prevTake="";
  if(mode==="again"){
    const ls=[...sess.lines]; let i=ls.length; while(i>0&&ls[i-1].by==="claude") i--;
    const gone=ls.slice(i); if(!gone.length) return;
    prevTake=gone.map(plLineText).join("\n");
    sess={...sess,lines:ls.slice(0,i)}; if(!await plSave(id,sess)) return;
    mode=plNextMode(sess);
  }
  const run=S.plRun={id,busy:true,text:"",err:"",mode,ctrl:new AbortController()};
  plRefresh(); scScrollTo(null);
  let text="", why="";
  try{
    const res=await S.sample([{role:"user",content:plPrompt(id,sess,mode,prevTake)}],{...plModel(),signal:run.ctrl.signal,onText:({text:t})=>{ run.text=t; plPending(); }});
    text=res.text||"";
  }catch(e){
    const c=e?.code; text=e?.text||run.text||"";
    if(c==="cancelled") why="";
    else if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared") why="Asking Claude isn’t allowed in this view.";
    else if(c==="rate_limited") why="Claude’s getting a lot of asks. Give it a minute, then try again.";
    else why="Couldn’t reach Claude"+(c?" ("+c+")":"")+".";
  }
  run.busy=false;
  const cur=plSess(id);
  const got=cur?plParse(text,cur):[];
  if(cur&&got.length){ await plSave(id,{...cur,lines:[...cur.lines,...got.map(l=>({k:lineKey(),speaker:l.speaker,text:l.text,by:"claude"}))]}); }
  else if(!why&&run.ctrl.signal.aborted===false) why="Claude didn’t come back with any lines.";
  run.err=why; if(!why&&S.plRun===run) S.plRun=null;
  plRefresh(); scScrollTo(null);
}

async function plSend(id){

  if(sp==="@dir"||dm){ by="dir"; sp=""; if(dm) t=dm[1].trim(); }
  else { const pre=scParsePrefix(t); if(pre){ sp=pre.speaker; t=pre.text.trim(); } }

async function playAct(act,el,id){
  const st=S.pl;
  switch(act){
    case "pl-open": S.pl=null; go("play-"+toHash(id)); return true;
    case "pl-you": { if(!st) return true; const r=S.scenes[st.id]; const su=plSetup(st.id,r); const v=el.dataset.sp||""; su.you=v; su.them=su.them.filter(x=>x!==v); render(); return true; }
    case "pl-them": { if(!st) return true; const su=plSetup(st.id,S.scenes[st.id]); const v=el.dataset.sp||""; su.them=su.them.includes(v)?su.them.filter(x=>x!==v):[...su.them,v]; plKeepNote(); render(); return true; }
    case "pl-start": {
      const r=S.scenes[id]; if(!r||!st) return true; plKeepNote(); const su=plSetup(id,r);
      if(!su.you||!su.them.length) return true;
      if((r.lines||[]).some(l=>!l.k)){ // give old lines real keys first, so "picks up after" keeps pointing at the right one
        const was=su.after; if(!await scSave(id,(r.lines||[]).map((l,i)=>({...l,k:scKey(l,i)})))) return true;
        if(was&&S.scRemap&&S.scRemap[was]) su.after=S.scRemap[was];
      }
      st.lastSetup={...su,them:[...su.them]};
      const ok=await plSave(id,{scene:id,you:su.you,them:su.them,after:su.after,note:String(su.note||"").trim(),lines:[],created:now()});
      if(ok){ st.setup=null; render(); setTimeout(()=>$("#pl-new")?.focus({preventScroll:true}),80); }
      return true; }
    case "pl-sp": if(!st) return true; st.sp=el.dataset.sp||""; { const sess=plSess(st.id); if(sess&&st.sp===sess.you) st.sp=null; } plRefresh(); { const ta=$("#pl-new"); if(ta){ const sess=plSess(st.id), sp=st.sp==null?sess.you:st.sp; ta.placeholder=sp==="@dir"?"Tell Claude where to take it…":sp?speakerName(sp)+" says…":"What happens…"; } } return true;
    case "pl-send": el.disabled=true; try{ await plSend(id); } finally{ el.disabled=false; } return true;
    case "pl-stop": if(S.plRun&&S.plRun.id===id) S.plRun.ctrl.abort(); return true;
    case "pl-retry": { S.plRun=null; plRun(id,plNextMode(plSess(id))); return true; }
    case "pl-keep": if(!st) return true; await plPatchLine(st.id,el.dataset.k,l=>({...l,keep:!l.keep})); plRefresh(); return true;
    case "pl-edit": if(!st||plRunning(st.id)) return true; st.edit=el.dataset.k; st.armed=null; render(); requestAnimationFrame(()=>{ $("#pl-edit")?.scrollIntoView({block:"center"}); }); return true;
    case "pl-ecancel": if(st){ const k=st.edit; st.edit=null; st.armed=null; render(); scScrollTo("x"); requestAnimationFrame(()=>document.getElementById("pll-"+k)?.scrollIntoView({block:"center"})); } return true;
    case "pl-esave": { if(!st) return true; const k=st.edit, t=($("#pl-etext")?.value||"").trim(); if(!t){ toast("That line’s empty. Delete it instead?"); return true; }
      st.edit=null; st.armed=null; await plPatchLine(st.id,k,l=>({...l,text:t})); render(); requestAnimationFrame(()=>document.getElementById("pll-"+k)?.scrollIntoView({block:"center"})); return true; }
    case "pl-del": { if(!st) return true; const k=st.edit; if(st.armed!=="del:"+k){ st.armed="del:"+k; render(); return true; } st.edit=null; st.armed=null; await plPatchLine(st.id,k,()=>null); render(); return true; }
    case "pl-again": {
      if(!st) return true; const sess=plSess(id); if(!sess) return true;
      const ls=sess.lines; let i=ls.length; while(i>0&&ls[i-1].by==="claude") i--;
      if(ls.slice(i).some(l=>l.keep&&!l.dropped)&&st.armed!=="again"){ st.armed="again"; plRefresh(); return true; }
      st.armed=null; plRun(id,"again"); return true; }
    case "pl-new": {
      if(!st) return true; const sess=plSess(id); if(!sess) return true;
      if(st.armed!=="new"){ st.armed="new"; plRefresh(); const n=plKeptOpen(sess).length; if(n) toast(`${n} kept line${n===1?" hasn’t":"s haven’t"} gone into the script yet.`); return true; }

      st.armed=null; st.lastSetup={you:sess.you,them:[...(sess.them||[])],note:sess.note||""}; st.setup=null; st.sp=null; st.drop=false;
      if(await plDiscard(id)){ render(); window.scrollTo(0,0); }

    case "pl-ctx": if(st){ st.showCtx=!st.showCtx; plRefresh(); } return true;
    case "pl-drop": if(st){ st.drop=true; st.dropAt=null; st.armed=null; plRefresh(); requestAnimationFrame(()=>$("#pl-comp")?.scrollIntoView({block:"end"})); } return true;
    case "pl-dropx": if(st){ st.drop=false; plRefresh(); } return true;
    case "pl-dropgo": el.disabled=true; try{ await plDrop(id); } finally{ el.disabled=false; } return true;

/* ---------- visual specs: screens, characters, items, cinematics; states; the tally; the asset manifest ----------
   Specs live in `specs` (doc id = spec id, never renamed). The Pip 2 planning room writes one doc per spec id into
   `asset_manifest` ({spec, state, paths:[repo paths], picked}) and nothing else; the app only reads it.
   Owner-only: guests render through renderGuest and never subscribe to either collection. */
const SPEC_KINDS=[["screen","Screen","▦"],["character","Character","◉"],["item","Item","◆"],["cinematic","Cinematic","▶"]];
const SPEC_KIND=Object.fromEntries(SPEC_KINDS.map(k=>[k[0],{label:k[1],g:k[2]}]));
const SHOTS=[["playable","Playable"],["establishing","Establishing"],["layout","Layout (map)"],["reveal","Reveal (scale)"],["insert","Insert (close detail)"]];
const SHOT=Object.fromEntries(SHOTS);
const SPEC_TIMES=["morning","midday","afternoon","day","dusk","night","dawn"];
const SPEC_TAGS=[["canon","Canon"],["mixed","Mixed"],["invented","Invented"]];
const SPEC_AREAS=[["fb_","Opening flashback"],["m1_","The marsh before the village"],["h1_","Hub 1"],["r12_","Road: hub 1 to hub 2"],["h2_","Hub 2"],["r23_","Road: hub 2 to hub 3"],["h3_","Hub 3"],["r34_","Road: hub 3 to hub 4"],["h4_","Hub 4"],["c_","Characters"],["p_","Items, props and pickups"]];
const SPEC_SHOWS=[["all","All specs"],["stale","Stale"],["noimg","No accepted image"],["exits","Exit problems"],["missing","Records without a spec"],["noplace","Screens with no place"],["noroute","Screens with no route"],["camera","Camera words"]];
/* words that do the camera's job inside a spec: the planning room turns shot purpose into the angle, and these pull Flow's camera about */
const CAMERA_WORDS=/\b(towering|towers? (?:over|above)|loom(?:s|ing)?|looking (?:up|down|across|along|out|over)|seen from|from (?:just|high|far|directly) above|from below|from the air|overhead view|bird'?s[- ]eye|aerial|low[- ]angle|high[- ]angle|close[- ]?up|close view|wide shot|fills? the (?:frame|middle of the frame)|(?:edge|side|bottom|top|middle) of the frame|in the foreground)\b/gi;
function cameraWords(s){ const t=[s.contents,s.visible,s.happens,s.start,s.end,s.change].filter(Boolean).join(" "); return [...new Set((t.match(CAMERA_WORDS)||[]).map(w=>w.toLowerCase()))]; }

function specArea(id){ const a=SPEC_AREAS.find(([p])=>id.startsWith(p)); return a?a[1]:"Other"; }
function specAreaIdx(id){ const i=SPEC_AREAS.findIndex(([p])=>id.startsWith(p)); return i<0?SPEC_AREAS.length:i; }
function specGameScope(){ if(S.filterGame!=="all") return S.filterGame; const g=gamesSorted().find(([id,x])=>id!=="series"&&!x.released); return g?g[0]:"all"; }
function specsIn(gid){ return Object.entries(S.specs||{}).filter(([,s])=>gid==="all"||s.game===gid); }
function specRoot(id){ let x=id, n=0; while(S.specs[x]?.state_of&&S.specs[S.specs[x].state_of]&&n++<8) x=S.specs[x].state_of; return x; }
function specSort(list){
  const o=id=>S.specs[id]?.order??99999;
  return list.sort((a,b)=>{ const ra=specRoot(a[0]), rb=specRoot(b[0]);
    return specAreaIdx(ra)-specAreaIdx(rb) || o(ra)-o(rb) || ra.localeCompare(rb) || (a[0]===ra?-1:b[0]===rb?1:o(a[0])-o(b[0])); });
}
function specSources(s){ return [...new Set([s.place,s.record,s.scene,...(s.beats||[]),...(s.in_shot||[])].filter(Boolean))]; }
function recStamp(id){ const f=find(id); return f?String(f.rec.updated||f.rec.created||""):""; }
function specStaleBy(s){ const w=String(s.written||s.created||""); if(!w) return []; return specSources(s).filter(x=>{ const u=recStamp(x); return u&&u>w; }); }
function specPick(id){
  const m=S.manifest?.[id]; if(!m) return null;
  const paths=Array.isArray(m.paths)?m.paths:m.paths?[m.paths]:m.path?[m.path]:[];
  return {paths:paths.map(String), state:m.state||"", picked:m.picked||m.updated||"", note:m.note||""};
}
function specStates(id){ return Object.entries(S.specs).filter(([,s])=>s.state_of===id).sort((a,b)=>(a[1].order??0)-(b[1].order??0)); }
function specExitIssues(list){
  const out=[];
  for(const [id,s] of list){
    for(const e of s.exits||[]){
      if(!e.to) continue;
      if(!S.specs[e.to]) out.push({id,note:`exit${e.label?" “"+e.label+"”":""} leads to ${e.to}, which isn’t a spec`});
      else if(!e.oneway&&!(S.specs[e.to].exits||[]).some(b=>b.to===id)) out.push({id,note:`goes to ${e.to}, which has no exit back (tick one-way if that’s on purpose)`});
    }
  }
  return out;
}
function specUses(rid){ return Object.entries(S.specs||{}).filter(([,s])=>s.place===rid||s.record===rid||s.scene===rid||(s.beats||[]).includes(rid)||(s.in_shot||[]).includes(rid)); }
function specMissing(gid){
  const used=new Set(); for(const s of Object.values(S.specs||{})) for(const x of [s.place,s.record,...(s.in_shot||[])]) if(x) used.add(x);
  return Object.entries(S.entries).filter(([id,e])=>["character","item","place"].includes(e.kind)&&(gid==="all"?isUnreleasedGame(e.game):e.game===gid)&&!used.has(id))
    .sort((a,b)=>KINDS.findIndex(k=>k[0]===a[1].kind)-KINDS.findIndex(k=>k[0]===b[1].kind)||(a[1].name||"").localeCompare(b[1].name||""));
}
function specTally(gid){
  const list=specsIn(gid);

    stale:list.filter(([,s])=>specStaleBy(s).length),
    noimg:list.filter(([id])=>!specPick(id)),
    exits:specExitIssues(list),
    missing:specMissing(gid),
    noplace:list.filter(([,s])=>s.kind==="screen"&&!s.place),
    noroute:list.filter(([,s])=>s.kind==="screen"&&!String(s.route||"").trim()),
    camera:list.filter(([,s])=>cameraWords(s).length)};
}
function specSnip(s){ return s.kind==="cinematic"?(s.happens||""):s.kind==="screen"?(s.contents||""):(s.show||""); }
function specRowHtml(id,s){
  const st=specStaleBy(s), pk=specPick(id), k=SPEC_KIND[s.kind]||{g:"·",label:"Spec"};

    s.shot?`<span class="tag">· ${esc(SHOT[s.shot]||s.shot)}</span>`:"", s.time?`<span class="tag">· ${esc(s.time)}</span>`:"",
    s.state?`<span class="tag">· ${s.state_of?"state: ":""}${esc(s.state)}</span>`:"",
    s.tag&&s.tag!=="canon"?`<span class="tag">· ${esc(s.tag)}</span>`:"",
    s.mystery?`<span class="sflag myst">mystery</span>`:"", st.length?`<span class="sflag stale">stale</span>`:"",
    pk?`<span class="sflag done">✓ picked</span>`:""].join("");
  return `<a class="card row spec ${s.state_of?"sstate":""}" href="#spec-${toHash(id)}"><span class="glyph">${k.g}</span><span class="main">
    <span class="title"><code class="sid">${esc(id)}</code></span><span class="meta">${meta}</span>

function specListHtml(list){

  for(const [id,s] of specSort(list)){ const a=specArea(specRoot(id)); if(a!==area){ area=a; h+=`<h3 class="sarea">${esc(a)}</h3>`; } h+=specRowHtml(id,s); }

function specFilt(){ if(!S.specF){ try{ S.specF=Object.assign({show:"all",kind:"all"},JSON.parse(recall("specf")||"{}")); }catch(e){ S.specF={show:"all",kind:"all"}; } } return S.specF; }

function specField(label,html){ return html?`<div class="sfield"><div class="sl">${label}</div><div class="sv">${html}</div></div>`:""; }
function specText(t){ return t?`<div class="prose">${renderText(t)}</div>`:""; }
function specLinks(ids){ return (ids||[]).filter(Boolean).map(x=>mentionHtml(x)).join(", "); }
function specLink(id){ return S.specs[id]?`<a class="mention" href="#spec-${toHash(id)}"><code class="sid">${esc(id)}</code></a>`:`<span class="warn"><code class="sid">${esc(id)}</code> (not a spec)</span>`; }
function viewSpec(id){

function specDraftFor(rid){
  const d={kind:"screen",status:"brainstorm",game:specGameScope()==="all"?"":specGameScope(),beats:[],exits:[]};
  if(!rid) return d;
  const f=find(rid); if(!f) return d; const r=f.rec; if(r.game) d.game=r.game==="series"?(specGameScope()==="all"?"series":specGameScope()):r.game;
  if(f.type==="entries"&&r.kind==="place") d.place=f.id;
  else if(f.type==="entries"&&(r.kind==="character"||r.kind==="item")){ d.kind=r.kind; d.record=f.id; }

}

/* ---------- shot list for the flow-assets skill, and Claude drafting specs for gaps ----------
   The shot list is a numbered list of snake_case names, each with what the image must hold, in game order.
   No style words: the planning room's recipe supplies them. Specs with an accepted image (asset_manifest)
   are skipped; stale ones are held back in their own section, never mixed into the list. */
function shotLine(label,t){ t=String(t||"").replace(/\s*\n+\s*/g," ").trim(); return t?`   ${label}: ${t}`:""; }
function shotName(id){ const f=find(id); return f&&f.type!=="inbox"?`${titleOf(f.type,f.rec)} (${f.id})`:id; }
const SHOT_FILE={pip_2:"pip-ff7"};  /* the game project's own name for its export files */
function shotFileSlug(gid){ return SHOT_FILE[gid]||(gid&&gid!=="all"?gid.replace(/_/g,"-"):""); }
/* positive fields only: "Must not be visible: Pip" is fine */
function shotHasPip(s){ if((s.in_shot||[]).includes("pip")) return true; return /\bPip\b/.test([s.contents,s.visible,s.happens,s.start,s.end,s.show,s.change].filter(Boolean).join(" ")); }
function shotItem(n,id,s){
  const L=[`${n}. ${id}`];
  const k=s.kind||"screen";
  L.push(`   ${["kind: "+k,s.shot?"shot: "+(SHOT[s.shot]||s.shot).toLowerCase():"",s.time?"time: "+s.time:"",s.mood?"mood: "+s.mood:"",s.mystery?"planted mystery":""].filter(Boolean).join(" · ")}`);
  if(s.state_of){ const src=S.specs[s.state_of], pk=specPick(s.state_of);
    L.push(`   State "${s.state||"variant"}" of ${s.state_of}: edit that image, don't regenerate.${pk&&pk.paths.length?" Accepted source: "+pk.paths.join(", ")+".":!src?" Its source spec is missing.":specStaleBy(src).length?" Its source is stale and held back below, so it has to be refreshed and made first.":" Its source has no accepted image yet, so make that first."}`);
    L.push(shotLine("What changes",s.change)); }
  if(s.kind==="screen"){
    L.push(shotLine("Path route",s.route||"NOT SET YET: the Story Room hasn't said which edges the path enters and leaves by. Ask Mike before generating."));
    L.push(shotLine("Characters stand",s.stand||"not set yet"));
    L.push(shotLine("Place",s.place?shotName(s.place):"none yet"));
    L.push(shotLine("Beats",(s.beats||[]).length?s.beats.map(shotName).join(", "):"padding"));
    L.push(shotLine("Contents",s.contents),shotLine("Must be visible",s.visible),shotLine("Must not be visible",s.hidden));
    if((s.exits||[]).length) L.push(shotLine("Exits",s.exits.map(e=>(e.label?e.label+" to ":"to ")+e.to+(e.oneway?" (one-way)":"")).join("; ")));
  } else if(s.kind==="cinematic"){
    L.push(shotLine("Scene",s.scene?shotName(s.scene):""),shotLine("What happens",s.happens),shotLine("Start frame",s.start),shotLine("End frame",s.end));
    L.push(shotLine("In shot",(s.in_shot||[]).map(shotName).join(", ")));
    if(shotHasPip(s)&&s.pip_ok) L.push("   Pip in shot: one of Mike's few vital Pip cinematics (his decision, 22 Nov; to be logged in docs/DECISIONS.md). Pip's look: his character record plus the reference image in the game project.");
  } else {
    L.push(shotLine(s.kind==="item"?"Belongs to":"Record",s.record?shotName(s.record):""),shotLine("Must show",s.show));
    L.push("   Isolated, full body, whole and unobstructed: the source for a 3D model.");
  }
  { const cw=cameraWords(s); if(cw.length) L.push(`   Camera words to leave out: ${cw.map(w=>'"'+w+'"').join(", ")}. Shot purpose sets the camera.`); }
  L.push(shotLine("Text on screen",s.text?`"${s.text}" (exact wording; painted in or overlaid is the planning room's call)`:""));
  return L.filter(Boolean).join("\n");
}
function shotArea(){ const a=expOpts().shotArea||""; return SPEC_AREAS.some(([p])=>p===a)?a:""; }
function shotList(gid){
  const ar=shotArea();
  const all=specSort(specsIn(gid||"all").filter(([id])=>!ar||specRoot(id).startsWith(ar)));
  const done=[], stale=[], pip=[], states=[], go=[];
  for(const x of all){ const [id,s]=x;
    if(specPick(id)) done.push(x); else if(specStaleBy(s).length) stale.push(x); else if(shotHasPip(s)&&!s.pip_ok) pip.push(x); else if(s.state_of) states.push(x); else go.push(x); }
  return {all,done,stale,pip,states,go};
}
function shotText(gid){
  const T=shotList(gid), ar=shotArea(), gl=(gid&&gid!=="all"?gameName(gid):"every game")+(ar?": "+(SPEC_AREAS.find(([p])=>p===ar)||["",""])[1].toLowerCase():"");
  const L=[`# Shot list: ${gl}`,"",`From Mike's Story Room, ${briefDate(now())}. ${T.go.length} to make, ${T.done.length} already picked (left out). Held back below: ${T.stale.length} stale, ${T.pip.length} with Pip in shot, ${T.states.length} states.`,"",
    `For the flow-assets skill: each numbered item is a name (use it as the image title), its kind (screen, character, item or cinematic) and what the image must hold. No style, medium or art direction here: the recipe's style block supplies all of that. Shot purpose is for the planning room to turn into a camera angle. Screens name the path's route (the edges it enters and leaves by) and where characters stand, so exits line up between screens. ${T.go.some(([,x])=>shotHasPip(x))?"Pip appears only in the cinematics Mike has approved as vital; each says so.":"Nothing in the numbered list asks for Pip."}`,""];
  const kinds=[["screen","Screens"],["character","Characters"],["item","Items, props and pickups"],["cinematic","Cinematics"]];
  let n=0;
  for(const [k,label] of kinds){
    const ks=T.go.filter(([,s])=>(s.kind||"screen")===k); if(!ks.length) continue;
    L.push(`## ${label}`,""); let area="";
    for(const [id,s] of ks){ const a=specArea(specRoot(id)); if(k==="screen"&&a!==area){ area=a; L.push(`### ${a}`,""); } n++; L.push(shotItem(n,id,s),""); }
  }
  if(!n) L.push("Nothing to make: every spec here is picked or held back.","");
  if(T.stale.length){
    L.push("## Held back: stale","","Written before the records they come from last changed. Don't generate these until Mike has refreshed them in the Story Room.","");
    for(const [id,s] of T.stale) L.push(`- ${id}: ${specStaleBy(s).map(shotName).join(", ")} changed since it was written`);
    L.push("");
  }
  if(T.pip.length){
    L.push("## Held back: Pip in shot","","Pip comes only from his Blender rig until docs/DECISIONS.md says otherwise, so these aren't for Flow yet.","");
    for(const [id,s] of T.pip) L.push(`- ${id} (${s.kind||"screen"})${specSnip(s)?": "+plainSnip(specSnip(s)).slice(0,120)+(plainSnip(specSnip(s)).length>120?"…":""):""}`);
    L.push("");
  }
  if(T.states.length){
    L.push("## Held back: states","","Variants made by editing their source image. Parked on the board until the slice needs them.","");
    for(const [id,s] of T.states) L.push(`- ${id}: "${s.state||"variant"}" of ${s.state_of}${s.change?". "+String(s.change).replace(/\s*\n+\s*/g," ").trim():""}`);
    L.push("");
  }
